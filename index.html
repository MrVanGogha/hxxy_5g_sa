<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>5G SA 专网仿真工作台</title>
<script type="text/javascript" src="https://robot.chaoxing.com/sdk/CxRobotSdkJs.js"></script>
<style>
  :root{
    --bg:#F4F6F9; --panel:#FFFFFF; --panel-2:#F7F9FC;
    --border:#DEE5EC; --border-soft:#EAEFF4;
    --text:#1B2A3A; --muted:#5B6B7C; --faint:#8C9AA9;
    --ok:#1E9E6E; --ok-bg:#E7F6EF;
    --warn:#C07F14; --warn-bg:#FCF3E0;
    --bad:#D6432F; --bad-bg:#FCE9E5;
    --blue:#2C6FE0; --blue-bg:#EAF1FD;
    --purple:#7C5CD6; --purple-bg:#F0EBFC;
    --mono: ui-monospace, "Cascadia Mono", Consolas, monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background:var(--bg);color:var(--text);font-family:"Microsoft YaHei","PingFang SC",system-ui,sans-serif;line-height:1.6}

  /* ===== 顶栏 ===== */
  header{background:var(--panel);border-bottom:1px solid var(--border);padding:14px 28px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;position:sticky;top:0;z-index:50}
  header .logo{font-size:18px;font-weight:700}
  header .logo small{display:block;font-size:12px;color:var(--muted);font-weight:400}
  header .spacer{flex:1}
  .hbtn{background:var(--panel-2);border:1px solid var(--border);border-radius:8px;padding:7px 14px;font-size:13px;color:var(--muted);cursor:pointer}
  .hbtn:hover{border-color:var(--blue);color:var(--blue)}

  .layout{display:grid;grid-template-columns:250px 1fr;gap:0;max-width:1440px;margin:0 auto;min-height:calc(100vh - 62px)}
  @media(max-width:900px){.layout{grid-template-columns:1fr}}

  /* ===== 步骤导航 ===== */
  nav.steps{background:var(--panel);border-right:1px solid var(--border);padding:20px 14px;position:sticky;top:62px;align-self:start;height:calc(100vh - 62px);overflow:auto}
  @media(max-width:900px){nav.steps{position:static;height:auto;display:flex;overflow-x:auto;gap:8px;border-right:none;border-bottom:1px solid var(--border)}}
  .step-item{display:flex;gap:12px;padding:12px 12px;border-radius:10px;cursor:pointer;border:1px solid transparent;margin-bottom:6px;align-items:flex-start;min-width:200px}
  .step-item:hover{background:var(--panel-2)}
  .step-item.active{background:var(--blue-bg);border-color:var(--blue)}
  .step-item.locked{opacity:.45;cursor:not-allowed}
  .step-num{flex:0 0 26px;width:26px;height:26px;border-radius:50%;background:var(--panel-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:700;color:var(--muted)}
  .step-item.active .step-num{background:var(--blue);color:#fff;border-color:var(--blue)}
  .step-item.done .step-num{background:var(--ok);color:#fff;border-color:var(--ok)}
  .step-name{font-size:13.5px;font-weight:600}
  .step-desc{font-size:11.5px;color:var(--faint);margin-top:1px}

  /* ===== 主区 ===== */
  main{padding:26px 32px 90px;min-width:0}
  .step-page{display:none;animation:fade .25s}
  .step-page.show{display:block}
  @keyframes fade{from{opacity:0;transform:translateY(6px)}to{opacity:1}}
  .page-title{font-size:21px;font-weight:700;margin:0 0 4px}
  .page-sub{color:var(--muted);font-size:13.5px;margin:0 0 22px}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:18px 20px;margin-bottom:18px}
  .card h3{margin:0 0 12px;font-size:15px}
  .hint{background:var(--blue-bg);border:1px solid #C9DBF9;border-radius:10px;padding:12px 16px;font-size:13px;color:#2B4E8F;margin-bottom:18px}
  .hint b{color:var(--blue)}

  /* 场景卡片 */
  .scn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:12px}
  .scn-card{border:2px solid var(--border);border-radius:12px;padding:14px 16px;cursor:pointer;background:var(--panel);transition:.15s}
  .scn-card:hover{border-color:var(--blue)}
  .scn-card.active{border-color:var(--ok);background:var(--ok-bg)}
  .scn-card .ic{font-size:22px}
  .scn-card .nm{font-weight:700;font-size:15px;margin:4px 0 2px}
  .scn-card .cat{font-size:11px;font-family:var(--mono);padding:2px 8px;border-radius:12px;background:var(--purple-bg);color:var(--purple);display:inline-block;margin-bottom:6px}
  .scn-card .bf{font-size:12.5px;color:var(--muted)}

  /* 需求指标表 */
  table.req{width:100%;border-collapse:collapse;font-size:13.5px}
  table.req th,table.req td{border:1px solid var(--border);padding:8px 12px;text-align:left}
  table.req th{background:var(--panel-2);width:130px;color:var(--muted);font-weight:600}
  .tag{display:inline-block;font-size:11.5px;font-family:var(--mono);background:var(--panel-2);border:1px solid var(--border-soft);border-radius:12px;padding:2px 10px;color:var(--muted);margin:2px 4px 2px 0}

  /* 带宽计算器 */
  .calc-row{display:grid;grid-template-columns:1.6fr .7fr .8fr .8fr .8fr 40px;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--border-soft);font-size:13.5px}
  .calc-row.head{font-size:12px;color:var(--faint);font-weight:600;border-bottom:1px solid var(--border)}
  select,input[type=number]{width:100%;background:var(--panel);border:1px solid var(--border);border-radius:8px;padding:8px 10px;font-size:13.5px;color:var(--text);font-family:inherit}
  select:focus,input:focus{outline:2px solid var(--blue);outline-offset:1px}
  .c-del{background:none;border:none;color:var(--bad);cursor:pointer;font-size:15px}
  .calc-sum-bar{display:flex;gap:28px;margin-top:14px;padding:14px 18px;background:var(--panel-2);border-radius:10px;font-size:14px;flex-wrap:wrap}
  .calc-sum-bar b{font-family:var(--mono);font-size:17px}
  .btn{background:var(--blue);color:#fff;border:none;border-radius:8px;padding:9px 20px;font-size:13.5px;font-weight:600;cursor:pointer}
  .btn:hover{filter:brightness(1.07)}
  .btn.ok{background:var(--ok)}
  .btn.ghost{background:var(--panel);color:var(--blue);border:1px solid var(--blue)}
  .btn:disabled{background:var(--border);color:var(--faint);cursor:not-allowed}
  .suggest{margin-top:10px;font-size:13px;padding:10px 14px;border-radius:8px;background:var(--ok-bg);border:1px solid #BDE5D2;color:#146B4B;display:none}
  .suggest.show{display:block}

  /* 思考前置 */
  .think{border-left:4px solid var(--purple);background:var(--purple-bg);border-radius:0 10px 10px 0;padding:12px 16px;margin-bottom:16px;font-size:13.5px}
  .think .tq{font-weight:600;margin-bottom:8px}
  .think label{display:inline-flex;align-items:center;gap:5px;margin-right:16px;cursor:pointer;color:var(--text)}
  .think .verdict{margin-top:8px;font-size:12.5px;display:none}
  .think .verdict.right{color:var(--ok)}
  .think .verdict.wrong{color:var(--warn)}

  /* 参数卡 */
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:14px}
  .pcard{border:1px solid var(--border);border-left:4px solid var(--border);border-radius:10px;padding:13px 16px;background:var(--panel)}
  .pcard label{display:block;font-size:13px;font-weight:700;color:var(--muted);margin-bottom:7px}
  .pcard .status{margin-top:9px;font-size:12.5px;line-height:1.55;display:none}
  .pcard.st-ok{border-left-color:var(--ok);background:linear-gradient(0deg,var(--ok-bg),var(--panel) 70%)}
  .pcard.st-bad{border-left-color:var(--bad)}
  .pcard.st-warn{border-left-color:var(--warn)}
  .pcard.st-ok .status,.pcard.st-bad .status,.pcard.st-warn .status,.pcard.st-pending .status{display:block}
  .pcard.st-bad .status{color:var(--bad)}
  .pcard.st-warn .status{color:var(--warn)}
  .retry{display:inline-block;margin-top:6px;font-size:12px;color:var(--blue);background:none;border:none;cursor:pointer;text-decoration:underline;padding:0}
  .badge4g{font-size:10.5px;font-family:var(--mono);background:var(--purple-bg);color:var(--purple);border-radius:10px;padding:1px 8px;margin-left:6px;font-weight:400}

  /* 拓扑 */
  .topo-wrap{overflow-x:auto}
  .topo-wrap svg{width:100%;min-width:820px;height:auto;display:block}
  .tn-box{fill:#F7F9FC;stroke:#C9D4E0;stroke-width:1.4}
  .tn-title{font-size:14px;font-weight:700;fill:#1B2A3A}
  .tn-sub{font-size:11px;fill:#8C9AA9}
  .tn-anno{fill:#fff;stroke:#DEE5EC}
  .tn-name{font-size:11.5px;font-weight:600;fill:#5B6B7C}
  .tn-val{font-size:12px;fill:#1B2A3A;font-family:var(--mono)}
  .tn-state{font-size:11px;fill:#8C9AA9}
  .topo-conn path{fill:none;stroke:#B8C6D4;stroke-width:1.6}
  .st-ok .tn-anno{stroke:var(--ok);stroke-width:2}
  .st-ok .tn-state{fill:var(--ok)}
  .st-bad .tn-anno{stroke:var(--bad);stroke-width:2}
  .st-bad .tn-state{fill:var(--bad)}
  .st-warn .tn-anno{stroke:var(--warn);stroke-width:2}
  .st-warn .tn-state{fill:var(--warn)}
  .boundary{fill:none;stroke:#C9D4E0;stroke-width:1.6;stroke-dasharray:7 5;border-radius:14px}
  .boundary.st-ok{stroke:var(--ok)}
  .tn-plane{font-size:11px;fill:#A8B5C2;font-family:var(--mono)}

  /* 结果区 */
  .score-hero{display:flex;align-items:center;gap:22px;flex-wrap:wrap}
  .ring{width:96px;height:96px;border-radius:50%;border:7px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:26px;font-weight:700;flex:0 0 auto}
  .diag{border:1px solid var(--border);border-radius:10px;padding:12px 16px;margin-bottom:10px;font-size:13.5px}
  .diag.ok{border-left:4px solid var(--ok)}
  .diag.bad{border-left:4px solid var(--bad);background:var(--bad-bg)}
  .diag.warn{border-left:4px solid var(--warn);background:var(--warn-bg)}
  .diag .dt{font-weight:700;margin-bottom:3px}
  .gauge{height:10px;border-radius:5px;background:var(--panel-2);overflow:hidden;margin:6px 0}
  .gauge>div{height:100%;border-radius:5px}
  table.map4g{width:100%;border-collapse:collapse;font-size:13px}
  table.map4g th,table.map4g td{border:1px solid var(--border);padding:7px 10px;text-align:left}
  table.map4g th{background:var(--purple-bg);color:#4B3591}

  footer{padding:20px;text-align:center;color:var(--faint);font-size:12px;font-family:var(--mono)}
  .navbtns{display:flex;justify-content:space-between;margin-top:26px}
  .teacher-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:10px}
  .teacher-cell{background:var(--panel-2);border:1px solid var(--border-soft);border-radius:8px;padding:10px 12px}
  .teacher-cell .n{font-family:var(--mono);font-size:20px;font-weight:700}
  .teacher-cell .l{font-size:12px;color:var(--faint)}
</style>
</head>

/* ============================================================
   §2 判定引擎（纯函数，继承旧版规则，一处出口）
   ============================================================ */
const ST = { UNSET:'unselected', PENDING:'pending', OK:'ok', BAD:'bad', WARN:'warn' };
const isNum = v => v !== '' && v !== null && v !== undefined;

function delayMetrics(sc, qi, loc){
  const pdb = QI_PDB[Number(qi)];
  const locDelay = loc === '园区下沉' ? 2 : 15;
  const simDelay = Math.round(0.15 * pdb + locDelay);
  return { qi:Number(qi), pdb, loc, locDelay, simDelay, threshold:sc.delayThreshold, pass: simDelay <= sc.delayThreshold };
}
function capacityMetrics(sc, spec){
  const capacity = CAPACITY[spec];
  const satisfaction = Math.round(capacity / sc.bandwidthReq * 100);
  const occupancy = Math.round(sc.bandwidthReq / capacity * 100);
  let status, text;
  if(satisfaction >= 100){ status = ST.OK;
    text = `容量满足度 ${satisfaction}%，规格「${spec}」（${capacity}Mbps）可承载场景带宽需求 ${sc.bandwidthReq}Mbps。`;
  } else if(satisfaction >= 75 && spec === '10G'){ status = ST.WARN;
    text = `已选最高规格「10G」（${capacity}Mbps），但场景理论需求达 ${sc.bandwidthReq}Mbps，满足度约 ${satisfaction}%。工程上可分区域部署第二套 UPF 分流——此项"有条件通过"，不扣分。`;
  } else { status = ST.BAD;
    text = `容量不足：场景需求 ${sc.bandwidthReq}Mbps，当前规格「${spec}」仅 ${capacity}Mbps（满足度 ${satisfaction}%），请提高规格档位。`;
  }
  return { spec, capacity, req:sc.bandwidthReq, satisfaction, occupancy, status, text };
}
function evSingleRule(sc, sel, k){
  const v = sel[k];
  const base = { key:k, value:v, correct:sc.correct[k] };
  if(v === '' || v == null) return { ...base, status:ST.UNSET, text:'尚未选择。' };
  const ok = sc.correct[k].includes(v);
  const reason = sc.reason[k] || '参考值与该场景终端并发/速率量级匹配。';
  return { ...base, status: ok?ST.OK:ST.BAD,
    text: ok ? `✅ 判定正确 — ${reason}` : `❌ 判定错误 — 正确应为「${sc.correct[k].join(' / ')}」。${reason}` };
}
function evFrame(sc, sel){
  const v = sel.frame;
  if(!v) return { key:'frame', value:v, correct:sc.correct.frame, status:ST.UNSET, text:'尚未选择。' };
  const ok = sc.correct.frame.includes(v);
  return { key:'frame', value:v, correct:sc.correct.frame, status: ok?ST.OK:ST.BAD,
    text: ok ? `✅ 判定正确 — ${sc.reason.frame}` : `❌ 判定错误 — 正确应为「${sc.correct.frame.join(' / ')}」。${sc.reason.frame}` };
}
function evSlot(sc, sel){
  const {frame, slot} = sel;
  if(!frame) return { key:'slot', value:slot, status: slot?ST.PENDING:ST.UNSET, text:'需先选择③帧结构类型。' };
  if(!slot) return { key:'slot', value:slot, status:ST.PENDING, text:'⏳ 待选择 — 请先确定③帧结构，再选时隙配比。' };
  const legal = (SLOT_BY_FRAME[frame]||[]).includes(slot);
  return { key:'slot', value:slot, status: legal?ST.OK:ST.BAD,
    text: legal ? `✅ 与帧结构「${frame}」联动匹配（合法组合：${SLOT_BY_FRAME[frame].join(' / ')}）。`
                : `❌ 时隙配比「${slot}」与帧结构「${frame}」不配套，合法取值为 ${SLOT_BY_FRAME[frame].join(' / ')}。` };
}
// URLLC：⑥+⑧ 联合时延仿真（升级版：错误时明确诊断责任归属）
function evJointDelay(sc, sel){
  const qi = sel.qi, loc = sel.upfLoc;
  if(!isNum(qi) || !loc){
    const mk = (key, v, half) => ({ key, value:v, status: isNum(v)&&v!==''?ST.PENDING:ST.UNSET,
      text: (isNum(v)&&v!=='') ? half : '尚未选择。' });
    return { qi: mk('qi', qi, '⏳ 待判定 · 需配合⑧UPF部署位置'),
             upfLoc: mk('upfLoc', loc, '⏳ 待判定 · 需配合⑥5QI值') };
  }
  const m = delayMetrics(sc, qi, loc);
  // 反事实诊断：固定对方，换最优值看能否通过 —— 告诉学生问题出在哪半边
  const qiFixPass  = delayMetrics(sc, 3, loc).pass;   // 若换成最优 5QI=3 能否过
  const locFixPass = delayMetrics(sc, qi, '园区下沉').pass; // 若换成下沉能否过
  let diag;
  if(m.pass) diag = `仿真时延 ${m.simDelay}ms ≤ 阈值 ${m.threshold}ms，满足要求。`;
  else if(!qiFixPass && locFixPass) diag = `问题主要在 ⑥5QI：即使 UPF 保持「${loc}」，只要 5QI 预算降到 50ms（5QI=3）即可达标；当前 5QI=${m.qi} 的标准预算 ${m.pdb}ms 过高。`;
  else if(qiFixPass && !locFixPass) diag = `问题主要在 ⑧部署位置：当前 5QI=${m.qi} 的预算本身可行，但「集中部署」引入 15ms 回传时延导致超标，改为「园区下沉」（约 2ms）即可达标。`;
  else diag = `⑥与⑧都有问题：5QI=${m.qi} 预算 ${m.pdb}ms 过高，且「${loc}」回传时延也偏大，需同时改为 5QI=3 + 园区下沉。`;
  return {
    qi: { key:'qi', value:qi, status: m.pass?ST.OK:ST.BAD, metric:m,
      text: (m.pass?'✅ ':'❌ ') + diag + `（5QI=${m.qi} 标准时延预算 ${m.pdb}ms）` },
    upfLoc: { key:'upfLoc', value:loc, status: m.pass?ST.OK:ST.BAD, metric:m,
      text: (m.pass?'✅ ':'❌ ') + `部署位置对总时延贡献 ${m.locDelay}ms。` + diag }
  };
}
function evQiRule(sc, sel){
  const v = sel.qi;
  if(!isNum(v)) return { key:'qi', value:v, correct:sc.correct.qi, status:ST.UNSET, text:'尚未选择。' };
  const ok = sc.correct.qi.includes(Number(v));
  return { key:'qi', value:v, correct:sc.correct.qi, status: ok?ST.OK:ST.BAD,
    text: ok ? '✅ 判定正确 — 下行缓冲/浏览类业务对时延不敏感，5QI=6 或 9 即可。'
             : `❌ 判定错误 — 正确应为 5QI=${sc.correct.qi.join('或')}。该场景对时延不敏感，选 URLLC 级低时延 5QI 会浪费调度资源。` };
}
function evUpfLocRule(sc, sel){
  const v = sel.upfLoc;
  if(!v) return { key:'upfLoc', value:v, correct:sc.correct.upfLoc, status:ST.UNSET, text:'尚未选择。' };
  const ok = sc.correct.upfLoc.includes(v);
  return { key:'upfLoc', value:v, correct:sc.correct.upfLoc, status: ok?ST.OK:ST.BAD,
    text: ok ? '✅ 判定正确 — 时延不敏感，可集中部署降低建设与运维成本。'
             : `❌ 判定错误 — 正确应为「${sc.correct.upfLoc.join('/')}」。该场景无需下沉边缘，集中部署性价比更高。` };
}
function evUpfSpec(sc, sel){
  const v = sel.upfSpec;
  if(!v) return { key:'upfSpec', value:v, status:ST.UNSET, text:'尚未选择。' };
  const m = capacityMetrics(sc, v);
  return { key:'upfSpec', value:v, status:m.status, text:(m.status===ST.OK?'✅ ':m.status===ST.WARN?'⚠️ ':'❌ ')+m.text, metric:m };
}
function evaluateAll(sc, sel){
  const params = {};
  params.deployMode = evSingleRule(sc, sel, 'deployMode');
  params.band = evSingleRule(sc, sel, 'band');
  params.frame = evFrame(sc, sel);
  params.slot = evSlot(sc, sel);
  params.sst = evSingleRule(sc, sel, 'sst');
  if(sc.category === 'urllc'){
    const j = evJointDelay(sc, sel);
    params.qi = j.qi; params.upfLoc = j.upfLoc;
  } else {
    params.qi = evQiRule(sc, sel);
    params.upfLoc = evUpfLocRule(sc, sel);
  }
  params.ambr = evSingleRule(sc, sel, 'ambr');
  params.upfSpec = evUpfSpec(sc, sel);
  const metrics = {
    delay: (sc.category==='urllc' && isNum(sel.qi) && sel.upfLoc) ? delayMetrics(sc, sel.qi, sel.upfLoc) : null,
    capacity: sel.upfSpec ? capacityMetrics(sc, sel.upfSpec) : null
  };
  const done = PARAM_KEYS.filter(k => params[k].status === ST.OK).length;
  const allChosen = PARAM_KEYS.every(k => isNum(sel[k]));
  return { params, metrics, done, allChosen, total:PARAM_KEYS.length };
}

];

const main = document.getElementById('mainHost');
const navEl = document.getElementById('stepNav');

function renderNav(){
  navEl.innerHTML = STEPS.map((s, i) => {
    const locked = !app.scenario && i > 0;
    const cls = ['step-item', i===app.step?'active':'', locked?'locked':'', stepDone(i)?'done':''].join(' ');
    return `<div class="${cls}" data-step="${i}">
      <div class="step-num">${stepDone(i) && i!==app.step ? '✓' : i+1}</div>
      <div><div class="step-name">${s.name}</div><div class="step-desc">${s.desc}</div></div>
    </div>`;
  }).join('');
  navEl.querySelectorAll('.step-item').forEach(el => {
    el.addEventListener('click', () => {
      const i = Number(el.dataset.step);
      if(!app.scenario && i > 0) return;
      app.step = i; render();
    });
  });
}
function stepDone(i){
  if(i === 0) return !!app.scenario;
  if(i === 1) return app.calcRows.some(r => r.bizId && Number(r.qty) > 0);
  const groups = {2:['deployMode'], 3:['band','frame','slot'], 4:['sst','qi','ambr','upfLoc'], 5:['upfSpec']};
  if(groups[i]) return groups[i].every(k => isNum(app.sel[k]));
  return false;
}

function render(keepScroll){
  renderNav();
  const pages = [pageScenario, pageCalc, pageArch, pageRadio, pageCore, pageSpec, pageResult];
  const y = window.scrollY;
  main.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'step-page show';
  div.innerHTML = pages[app.step]();
  main.appendChild(div);
  bindPage(app.step, div);
  if(keepScroll) window.scrollTo(0, y);
  else window.scrollTo({top:0, behavior:'smooth'});
  saveProgress();
}

/* 进度持久化：刷新不丢失（按场景隔离） */
const PKEY = 'sa5g_progress';
function saveProgress(){
  if(!app.scenario) return;
  try{
    localStorage.setItem(PKEY, JSON.stringify({
      scenarioId: app.scenario.id, sel: app.sel, think: app.think,
      calcRows: app.calcRows, calcSeq, attempts: app.attempts, step: app.step
    }));
  }catch(e){}
}
function loadProgress(){
  try{
    const p = JSON.parse(localStorage.getItem(PKEY));
    if(!p) return;
    const sc = SCENARIOS.find(s => s.id === p.scenarioId);
    if(!sc) return;
    app.scenario = sc; app.sel = p.sel || {}; app.think = p.think || {};
    app.calcRows = p.calcRows || []; calcSeq = p.calcSeq || 0;
    app.attempts = p.attempts || 0; app.step = p.step || 0;
  }catch(e){}
}
function navBtns(prevOk = true, nextLabel = '下一步 →', nextOk = true){
  return `<div class="navbtns">
    <button class="btn ghost" id="prevBtn" ${app.step===0?'disabled':''}>← 上一步</button>
    <button class="btn" id="nextBtn" ${nextOk?'':'disabled'}>${nextLabel}</button>
  </div>`;
}

    <div class="hint">📖 <b>计算方法：</b>逐业务：单路带宽 × 并发数量 = 小计；全部累加后 <b>×1.2（加 20% 冗余）</b>，再向上取整到标准档位（1G / 5G / 10G）。</div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">

function allFilled(){ return PARAM_KEYS.every(k => isNum(app.sel[k])); }

function resultHtml(snap, sc){
  const r = snap.result;
  const score = Math.round(r.done / r.total * 100);
  const nonOk = PARAM_KEYS.filter(k => r.params[k].status !== ST.OK);
  const onlyWarn = nonOk.length > 0 && nonOk.every(k => r.params[k].status === ST.WARN);
  const color = onlyWarn || score >= 60 ? (score >= 90 || onlyWarn ? 'var(--ok)' : 'var(--warn)') : 'var(--bad)';
  const m = r.metrics;
  return `
    <div class="card score-hero">
      <div class="ring" style="border-color:${color};color:${color}">${onlyWarn ? '有条件<br>通过' : score}</div>
      <div style="flex:1;min-width:240px">
        <h3 style="margin:0 0 4px">${sc.icon} ${sc.name} · 方案评估（第 ${snap.attempt} 次提交）</h3>
        <p style="margin:0;color:var(--muted);font-size:13.5px">${onlyWarn
          ? `9 项参数判定全部正确；其中 ${nonOk.length} 项受候选值上限限制为"有条件通过"，不计扣分。`
          : `9 项参数中 <b>${r.done}</b> 项判定正确。${nonOk.length ? '错误项诊断见下，可回对应步骤修正。' : '全部通过，🎉 方案达标！'}`}</p>
      </div>
      <button class="btn ghost" id="exportBtn">📄 导出结果（Markdown）</button>
    </div>
    <div class="card">
      <h3>🗺️ 方案拓扑总览</h3>
      <p style="font-size:12.5px;color:var(--muted);margin:0 0 8px">你的全部参数选择及其在网络中的生效位置，各网元按本次判定结果着色（绿=合格，红=不合格，黄=有条件通过）。</p>
      <div class="topo-wrap" id="topoHost"></div>
    </div>
    ${(m.delay || m.capacity) ? `
    <div class="card"><h3>📊 仿真仪表</h3>
      ${m.delay ? `<div style="font-size:13.5px">仿真时延：<b style="font-family:var(--mono);color:${m.delay.pass?'var(--ok)':'var(--bad)'}">${m.delay.simDelay} ms</b>（阈值 <${m.delay.threshold}ms）</div>
        <div class="gauge"><div style="width:${Math.min(100, Math.round(m.delay.simDelay/m.delay.threshold*100))}%;background:${m.delay.pass?'var(--ok)':'var(--bad)'}"></div></div>` : ''}
      ${m.capacity ? `<div style="font-size:13.5px;margin-top:8px">容量满足度：<b style="font-family:var(--mono);color:${m.capacity.status===ST.OK?'var(--ok)':m.capacity.status===ST.WARN?'var(--warn)':'var(--bad)'}">${m.capacity.satisfaction}%</b>（${m.capacity.capacity}Mbps / 需求 ${m.capacity.req}Mbps）</div>
        <div class="gauge"><div style="width:${Math.min(100, m.capacity.satisfaction)}%;background:${m.capacity.status===ST.OK?'var(--ok)':m.capacity.status===ST.WARN?'var(--warn)':'var(--bad)'}"></div></div>` : ''}
    </div>` : ''}
    <div class="card"><h3>🩺 逐项诊断报告</h3>
      ${PARAM_KEYS.map(k => {
        const p = r.params[k];
        const cls = p.status===ST.OK?'ok':p.status===ST.WARN?'warn':p.status===ST.BAD?'bad':'';
        return `<div class="diag ${cls}"><div class="dt">${PARAM_LABELS[k]}：${p.value ?? '未选'}</div><div>${p.text}</div></div>`;
      }).join('')}
    </div>
    <div class="card"><h3>📚 5G↔4G 参数对应关系</h3>
      <table class="map4g">
        <tr><th>5G SA 参数</th><th>4G LTE 对应</th><th>功能相似性</th><th>关键区别</th></tr>
        ${MAP4G_TABLE.map(r2 => `<tr>${r2.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}
      </table>
    </div>`;
}

function paintTopo(){
  const host = document.getElementById('topoHost');
  if(!host || !app.scenario) return;
  if(!host.querySelector('svg')) host.innerHTML = topoSvg();
  const r = evaluateAll(app.scenario, app.sel);
  const snap = app.snapshot && app.snapshot.live ? app.snapshot.result : null;
  ['sst','qi','ambr','band','frame','upfLoc','upfSpec'].forEach(k => {
    const g = host.querySelector('#tn-' + k);
    if(!g) return;
    const src = snap ? snap.params[k] : r.params[k];
    const st = snap ? src.status : (isNum(app.sel[k]) ? 'pending' : 'unselected');
    g.setAttribute('class', 'tnode st-' + (st==='pending' ? '' : st));
    g.querySelector('.tn-val').textContent = k === 'frame'
      ? `${app.sel.frame || '未选'}${app.sel.slot ? ' / ' + app.sel.slot : ''}`
      : (app.sel[k] || '未选');
    g.querySelector('.tn-state').textContent = snap
      ? (src.status===ST.OK?'✔ 合格':src.status===ST.WARN?'⚠ 有条件':src.status===ST.BAD?'✘ 不合格':'')
      : '';
  });
  const dm = host.querySelector('#dmText');
  if(dm) dm.textContent = `① 部署模式：${app.sel.deployMode || '未选择'}`;
  const bd = host.querySelector('#topo-boundary');
  if(bd) bd.setAttribute('class', 'boundary' + (app.sel.deployMode ? ' st-ok' : ''));
}

/* ============================================================
   §6 页面绑定逻辑
   ============================================================ */
function markStale(){ if(app.snapshot) app.snapshot.live = false; }

function bindPage(step, root){
  // 通用：底部翻页
  const prev = root.querySelector('#prevBtn'), next = root.querySelector('#nextBtn');
  if(prev) prev.addEventListener('click', () => { if(app.step>0){ app.step--; render(); } });
  if(next) next.addEventListener('click', () => { if(app.step<STEPS.length-1){ app.step++; render(); } });

  if(step === 0){
    root.querySelectorAll('.scn-card').forEach(c => c.addEventListener('click', () => {
      const sc = SCENARIOS.find(s => s.id === c.dataset.id);
      if(!app.scenario || app.scenario.id !== sc.id){
        app.scenario = sc; app.sel = {}; app.think = {}; app.calcRows = [];
        app.snapshot = null; app.attempts = 0;
      }
      render();
    }));
  }
  if(step === 1) bindCalc(root);
  if([2,3,4,5].includes(step)) bindParams(root, step);
  if(step === 6) bindResult(root);
}

/* 思考前置绑定 */
function bindThinks(root){
  root.querySelectorAll('.think').forEach(el => {
    const key = el.dataset.think;
    // 恢复之前已答的思考题状态（参数变化触发页面重绘时不丢失）
    const saved = app.think[key];
    if(saved){
      const t = THINK_ANSWERS[key];
      const radio = el.querySelector(`input[value="${saved}"]`);
      if(radio) radio.checked = true;
      const v0 = el.querySelector('.verdict');
      v0.style.display = 'block'; v0.className = 'verdict right';
      v0.textContent = '💡 ' + t.verdictFn(saved);
    }
    el.querySelectorAll('input[type=radio]').forEach(radio => {
      radio.addEventListener('change', () => {
        const t = THINK_ANSWERS[key];
        app.think[key] = radio.value;
        const v = el.querySelector('.verdict');
        v.style.display = 'block';
        v.className = 'verdict right';
        v.textContent = '💡 ' + t.verdictFn(radio.value);
      });
    });
  });
}

/* 参数卡绑定 */
function bindParams(root, step){
  if(step === 2){ const h = root.querySelector('#topoHost'); if(h){ h.innerHTML = topoSvg(); paintTopo(); } }
  bindThinks(root);
  const keys = {2:['deployMode'], 3:['band','frame','slot'], 4:['sst','qi','ambr','upfLoc'], 5:['upfSpec']}[step] || [];
  keys.forEach(key => {
    const sel = root.querySelector('#sel-' + key);
    if(!sel) return;
    sel.addEventListener('change', () => {
      app.sel[key] = sel.value;
      if(key === 'frame'){
        const legal = SLOT_BY_FRAME[sel.value] || [];
        if(app.sel.slot && !legal.includes(app.sel.slot)) app.sel.slot = '';
      }
      markStale();
      render(true);
    });
  });
  paintSnapshotOnCards(root, keys);
}
function paintSnapshotOnCards(root, keys){
  const snap = app.snapshot;
  keys.forEach(key => {
    const card = root.querySelector('#pcard-' + key);
    const stEl = root.querySelector('#status-' + key);
    const sel = root.querySelector('#sel-' + key);
    if(!card || !stEl) return;
    if(snap && snap.live){
      const p = snap.result.params[key];
      card.classList.add('st-' + p.status);
      stEl.innerHTML = p.text;
      if(p.status === ST.OK){ sel.disabled = true; }
      else {
        const b = document.createElement('button');
        b.className = 'retry'; b.textContent = '重新选择此项 →';
        b.addEventListener('click', () => { markStale(); render(true); });
        stEl.appendChild(b);
      }
    }
  });
}

/* 带宽计算器 */
let calcSeq = 0;
function calcFinal(){
  const total = app.calcRows.reduce((a, r) => {
    const b = BUSINESS_POOL.find(x => x.id === r.bizId);
    return a + (b ? b.unitMbps * (Number(r.qty)||0) : 0);
  }, 0);
  return +(total * (1 + REDUNDANCY)).toFixed(2);
}
function bindCalc(root){
  const host = root.querySelector('#calcRows');
  function paint(){
    if(!app.calcRows.length){
      host.innerHTML = `<div style="padding:18px;color:var(--faint);font-size:13px;text-align:center">还没有业务行 — 点击「＋ 添加业务」，挑出本场景会用到的业务并填并发数量。</div>`;
    } else {
      host.innerHTML = `<div class="calc-row head"><div>业务类型</div><div>方向</div><div>单路带宽</div><div>数量</div><div>小计(Mbps)</div><div></div></div>` +
        app.calcRows.map(r => {
          const b = BUSINESS_POOL.find(x => x.id === r.bizId);
          const used = new Set(app.calcRows.map(x => x.bizId).filter(Boolean));
          return `<div class="calc-row" data-row="${r.rowId}">
            <select class="c-biz">
              <option value="">请选择业务类型…</option>
              ${BUSINESS_POOL.map(x => `<option value="${x.id}" ${x.id===r.bizId?'selected':''} ${x.id!==r.bizId && used.has(x.id)?'disabled':''}>${x.name}</option>`).join('')}
            </select>
            <div>${b?b.direction:'—'}</div>
            <div style="font-family:var(--mono)">${b?b.unitMbps+' Mbps':'—'}</div>
            <input type="number" class="c-qty" min="0" step="1" placeholder="数量" value="${r.qty}">
            <div style="font-family:var(--mono)">${b ? (b.unitMbps*(Number(r.qty)||0)).toFixed(1) : '—'}</div>
            <button class="c-del" title="删除">✕</button>
          </div>`;
        }).join('');
    }
    const total = app.calcRows.reduce((a, r) => {
      const b = BUSINESS_POOL.find(x => x.id === r.bizId);
      return a + (b ? b.unitMbps*(Number(r.qty)||0) : 0);
    }, 0);
    const fin = +(total * 1.2).toFixed(2);
    root.querySelector('#calcTotal').textContent = total.toFixed(1) + ' Mbps';
    root.querySelector('#calcFinal').textContent = fin + ' Mbps';
    root.querySelector('#calcTier').textContent = fin > 0 ? tierOf(fin) : '—';
    const sg = root.querySelector('#calcSuggest');
    if(fin > 0 && app.scenario){
      sg.classList.add('show');
      sg.innerHTML = `📌 记住这个数字：<b>${fin} Mbps</b>，第 6 步选 ⑨UPF 规格时要用。` +
        (fin > app.scenario.bandwidthReq * 1.5 ? ' ⚠️ 注意：你的估算明显高于场景基线，检查一下是否多算了业务或数量。' : '');
    } else sg.classList.remove('show');
  }
  root.querySelector('#addRow').addEventListener('click', () => {
    app.calcRows.push({ rowId:++calcSeq, bizId:'', qty:'' }); paint();
  });
  host.addEventListener('change', e => {
    const rowEl = e.target.closest('.calc-row'); if(!rowEl) return;
    const r = app.calcRows.find(x => x.rowId === Number(rowEl.dataset.row));
    if(e.target.classList.contains('c-biz')) r.bizId = e.target.value;
    if(e.target.classList.contains('c-qty')) r.qty = Math.max(0, Math.floor(Number(e.target.value)||0));
    paint();
  });
  host.addEventListener('click', e => {
    if(!e.target.classList.contains('c-del')) return;
    const rowEl = e.target.closest('.calc-row');
    app.calcRows = app.calcRows.filter(x => x.rowId !== Number(rowEl.dataset.row));
    paint();
  });
  paint();
}

/* 提交与结果 */
function bindResult(root){
  const th = root.querySelector('#topoHost');
  if(th){ th.innerHTML = topoSvg(); paintTopo(); }
  root.querySelector('#submitBtn').addEventListener('click', () => {
    if(!allFilled()) return;
    app.attempts++;
    app.snapshot = { result: evaluateAll(app.scenario, app.sel), live:true, attempt:app.attempts, at:new Date() };
    recordStats(app.scenario.id, app.snapshot.result);
    render();
  });
  const ex = root.querySelector('#exportBtn');
  if(ex) ex.addEventListener('click', exportMarkdown);
}

/* 导出 Markdown */
function exportMarkdown(){
  const sc = app.scenario, snap = app.snapshot;
  if(!snap) return;
  const r = snap.result;
  const lines = [];
  lines.push(`# ${sc.name} 5G SA 专网仿真评测结果`, '');
  lines.push(`- 提交次数：第 ${snap.attempt} 次 · 时间：${snap.at.toLocaleString('zh-CN')}`);
  lines.push(`- 总分：${r.done}/${r.total} 项合格`, '');
  lines.push(`## 参数配置与判定`, '');
  lines.push(`| 参数 | 本组取值 | 判定 | 说明 |`, `|---|---|---|---|`);
  PARAM_KEYS.forEach(k => {
    const p = r.params[k];
    const st = p.status===ST.OK?'✅合格':p.status===ST.WARN?'⚠️有条件通过':p.status===ST.BAD?'❌不合格':'未判定';
    lines.push(`| ${PARAM_LABELS[k]} | ${p.value ?? '—'} | ${st} | ${p.text.replace(/\|/g,'/')} |`);
  });
  if(r.metrics.delay) lines.push('', `## 时延仿真`, `仿真时延 ${r.metrics.delay.simDelay}ms（阈值 <${r.metrics.delay.threshold}ms），${r.metrics.delay.pass?'满足':'不满足'}要求。`);
  if(r.metrics.capacity) lines.push('', `## 容量仿真`, `UPF 规格 ${r.metrics.capacity.spec}（${r.metrics.capacity.capacity}Mbps），场景需求 ${r.metrics.capacity.req}Mbps，满足度 ${r.metrics.capacity.satisfaction}%。`);
  lines.push('', `## 5G↔4G 对应关系`, '', `| 5G SA | 4G LTE | 相似性 | 区别 |`, `|---|---|---|---|`);
  MAP4G_TABLE.forEach(row => lines.push(`| ${row.join(' | ')} |`));
  const blob = new Blob([lines.join('\n')], { type:'text/markdown;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${sc.name}_5GSA仿真评测结果.md`;
  a.click(); URL.revokeObjectURL(a.href);
}

/* ============================================================
   §7 顶栏弹层：4G 速查 + 教师统计
   ============================================================ */
function modal(html){
  const ov = document.createElement('div');
  ov.style.cssText = 'position:fixed;inset:0;background:rgba(20,30,45,.4);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px';
  ov.innerHTML = `<div style="background:#fff;border-radius:14px;max-width:860px;width:100%;max-height:84vh;overflow:auto;padding:24px 28px">
    <div style="text-align:right"><button class="hbtn" id="mClose">关闭 ✕</button></div>${html}</div>`;
  ov.addEventListener('click', e => { if(e.target === ov || e.target.id === 'mClose') ov.remove(); });
  document.body.appendChild(ov);
}
document.getElementById('btn4g').addEventListener('click', () => {
  modal(`<h3 style="margin-top:0">📚 5G ↔ 4G 参数对应关系速查表</h3>
    <table class="map4g"><tr><th>5G SA 参数</th><th>4G LTE 对应</th><th>功能相似性</th><th>关键区别</th></tr>
    ${MAP4G_TABLE.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</table>
    <p style="font-size:12.5px;color:var(--muted)">理解 5G 与 4G 参数的对应关系，有助于把已学的 4G 知识迁移到 5G 专网设计中。</p>`);
});
document.getElementById('btnTeacher').addEventListener('click', () => {
  const all = loadStats();
  const cells = [];
  Object.entries(all).forEach(([scId, rec]) => {
    const sc = SCENARIOS.find(s => s.id === scId);
    PARAM_KEYS.forEach(k => {
      const w = rec.wrong[k] || 0;
      if(rec.total > 0) cells.push({ sc: sc ? sc.name : scId, k, rate: Math.round(w/rec.total*100), w, t: rec.total });
    });
  });
  modal(`<h3 style="margin-top:0">👩‍🏫 教师统计（本机累计，按参数错误率）</h3>
    ${cells.length ? `<div class="teacher-grid">${cells.map(c => `
      <div class="teacher-cell"><div class="n" style="color:${c.rate>50?'var(--bad)':c.rate>20?'var(--warn)':'var(--ok)'}">${c.rate}%</div>
      <div class="l">${c.sc} · ${PARAM_LABELS[c.k]}（错 ${c.w}/${c.t} 次）</div></div>`).join('')}</div>
      <button class="hbtn" id="clearStats" style="margin-top:14px">🗑 清空统计</button>`
    : '<p style="color:var(--muted)">还没有提交记录。学生提交评测后，这里按参数累计错误率。</p>'}`);
  const cs = document.getElementById('clearStats');
  if(cs) cs.addEventListener('click', () => { localStorage.removeItem(TKEY); document.querySelector('.hbtn#mClose')?.click(); });
});

/* 启动 */
loadProgress();
render();
