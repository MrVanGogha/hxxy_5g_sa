<style>
  :root{
    --bg:#F2F5F2; --panel:#FFFFFF; --panel-2:#F6F8F6; --paper:#FCFDFB;
    --border:#CFDAD6; --border-soft:#E3EAE6;
    --text:#15363B; --muted:#4B6267; --faint:#5F7073;
    --primary:#006D72; --primary-hover:#005B60; --primary-bg:#E2F2EF; --primary-line:#8EC8C4;
    --accent:#B95118; --accent-bright:#D57835; --accent-bg:#FBEEE4;
    --info:#315F9D; --info-bg:#EAF0F8;
    --ok:#21724C; --ok-bg:#E7F3EB; --warn:#8A5A06; --warn-bg:#FBF1DA; --bad:#B63B32; --bad-bg:#FBEAE7;
    --disabled:#D7DFDC; --focus:#B95118; --shadow-pop:0 12px 32px rgba(21,54,59,.12);
    /* 纸面网格（关掉背景纹理：把下面两个变量都改成 transparent 即可） */
    --bg-rule:rgba(0,109,114,.055); --bg-rule-fine:rgba(0,109,114,.022);
    --blue:var(--primary); --blue-bg:var(--primary-bg); --purple:var(--info); --purple-bg:var(--info-bg);
    --mono:"Cascadia Mono","Cascadia Code","SFMono-Regular",Consolas,"Liberation Mono",monospace;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0}
  body{background-color:var(--bg);
    background-image:
      linear-gradient(to right,var(--bg-rule) 1px,transparent 1px),
      linear-gradient(to bottom,var(--bg-rule) 1px,transparent 1px),
      linear-gradient(to right,var(--bg-rule-fine) 1px,transparent 1px),
      linear-gradient(to bottom,var(--bg-rule-fine) 1px,transparent 1px);
    background-size:160px 160px,160px 160px,32px 32px,32px 32px;
    color:var(--text);font-family:"Segoe UI","Microsoft YaHei UI","Microsoft YaHei","PingFang SC","Noto Sans CJK SC",system-ui,sans-serif;font-size:14px;line-height:1.65}
  button,input,select{font:inherit}
  button{touch-action:manipulation}
  button:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,[tabindex]:focus-visible{outline:2px solid var(--focus);outline-offset:3px}
  .sr-only{position:absolute!important;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}

  /* 顶栏：三段硬切频谱带 + 纯 CSS 信号标识 */
  header{min-height:84px;background:var(--panel);border-bottom:1px solid var(--border);padding:3px 28px 0;display:flex;align-items:center;gap:18px;position:sticky;top:0;z-index:50}
  header::before{content:"";position:absolute;inset:0 0 auto;height:3px;background:linear-gradient(90deg,var(--primary) 0 62%,var(--accent) 62% 74%,var(--info) 74% 100%)}
  header .logo{display:flex;align-items:center;gap:14px;font-size:22px;line-height:30px;font-weight:700}
  header .logo small{display:block;font-size:13px;line-height:20px;color:var(--muted);font-weight:400}
  .seal{width:46px;height:46px;flex:0 0 auto;display:block;-webkit-user-drag:none;user-select:none}
  header .spacer{flex:1}
  .hbtn{min-height:40px;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:8px 16px;font-size:13.5px;color:var(--muted);cursor:pointer;transition:background 160ms ease-out,border-color 160ms ease-out,color 160ms ease-out}
  .hbtn:hover{border-color:var(--primary);color:var(--primary);background:var(--primary-bg)}

  .layout{display:grid;grid-template-columns:280px minmax(0,1fr);min-height:calc(100vh - 84px)}
  nav.steps{background:var(--panel);border-right:1px solid var(--border);padding:20px 14px;position:sticky;top:84px;align-self:start;height:calc(100vh - 84px);overflow:auto}
  .step-item{position:relative;display:flex;gap:12px;width:100%;padding:10px 10px 10px 14px;border:1px solid transparent;border-radius:8px;margin:0 0 8px;background:transparent;color:var(--text);text-align:left;cursor:pointer;align-items:flex-start;min-height:64px;transition:background 160ms ease-out}
  .step-item:not(:first-child)::before{content:"";position:absolute;left:29px;top:-9px;width:2px;height:10px;background:var(--border)}
  .step-item.done::before{background:var(--primary)}
  .step-item:hover{background:var(--panel-2)}
  .step-item.active{background:var(--primary-bg);box-shadow:inset 3px 0 var(--primary)}
  .step-item.locked{cursor:not-allowed;color:var(--muted)}
  .step-num{position:relative;flex:0 0 30px;width:30px;height:30px;border-radius:6px;background:var(--panel-2);border:1px solid var(--border);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:12.5px;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted)}
  .step-item.active .step-num{background:var(--primary);color:#fff;border-color:var(--primary)}
  .step-item.active .step-num::after{content:"";position:absolute;right:-5px;top:-4px;width:6px;height:6px;border-radius:50%;background:var(--accent);animation:signalPulse 1.8s ease-in-out infinite}
  .step-item.done:not(.active) .step-num{background:var(--ok);color:#fff;border-color:var(--ok)}
  .step-item.done.active .step-name::after{content:"✓";color:var(--ok);margin-left:8px;font-weight:700}
  .step-item.locked .step-num{border-style:dashed;background:var(--panel);color:var(--muted)}
  .step-name{font-size:14px;line-height:20px;font-weight:700}
  .step-desc,.step-state{display:block;font-size:12.5px;line-height:20px;color:var(--muted);margin-top:2px}
  .step-state.stale{color:var(--warn)}
  @keyframes signalPulse{0%,100%{opacity:.45;transform:scale(.85)}50%{opacity:1;transform:scale(1.25)}}

  main{padding:28px 32px 88px;min-width:0}
  .step-page{display:none;max-width:1240px;animation:pageIn 180ms ease-out}
  .step-page.show{display:block}
  @keyframes pageIn{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:translateY(0)}}
  .page-title{font-size:26px;line-height:34px;font-weight:700;margin:0 0 4px;outline:none}
  .page-sub{color:var(--muted);font-size:14px;line-height:23px;margin:0 0 12px}
  .step-goal{display:flex;justify-content:space-between;gap:16px;align-items:center;background:var(--paper);border:1px solid var(--border-soft);border-left:3px solid var(--primary);border-radius:8px;padding:10px 14px;margin:0 0 20px;font-size:14px}
  .goal-progress{flex:0 0 auto;color:var(--primary);font-family:var(--mono);font-weight:700;font-variant-numeric:tabular-nums}
  .card{background:var(--panel);border:1px solid var(--border);border-radius:12px;padding:20px 22px;margin-bottom:20px}
  .card h3{margin:0 0 12px;font-size:16px;line-height:24px;font-weight:700}
  .card h3::before{content:"";display:inline-block;width:12px;height:3px;background:var(--primary);margin:0 8px 4px 0}
  .hint{background:var(--info-bg);border:1px solid #C9D7E8;border-radius:10px;padding:12px 16px;font-size:14px;color:var(--text);margin-bottom:20px}
  .hint b{color:var(--info)}
  .hint.warning{background:var(--warn-bg);border-color:#E6CE9C;color:var(--text)}
  .empty-state{padding:20px;border:1px dashed var(--border);border-radius:10px;background:var(--paper);color:var(--muted);text-align:center}

  /* 场景卡片 */
  .scn-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(236px,1fr));gap:16px}
  .scn-card{position:relative;border:1px solid var(--border);border-top:3px solid var(--primary);border-radius:12px;padding:16px;cursor:pointer;background:var(--panel);transition:transform 160ms ease-out,border-color 160ms ease-out,box-shadow 160ms ease-out}
  .scn-card.urllc{border-top-color:var(--accent)}.scn-card.embb{border-top-color:var(--primary)}
  .scn-card:hover{border-color:var(--primary);transform:translateY(-2px);box-shadow:0 6px 16px rgba(21,54,59,.08)}
  .scn-card.active{border:2px solid var(--primary);border-top-width:3px;background:var(--primary-bg);padding:15px}
  .scn-card.active.urllc{border-top-color:var(--accent)}
  .scn-card .ic{width:36px;height:36px;display:inline-flex;align-items:center;justify-content:center;background:var(--panel-2);border:1px solid var(--border-soft);border-radius:6px;font-size:20px;margin-bottom:8px}
  .scn-card .nm{font-size:16px;line-height:24px;font-weight:700;margin:4px 0 2px}
  .scn-card .cat{font-size:12.5px;padding:2px 8px;border-radius:4px;background:var(--primary-bg);color:var(--primary);display:inline-block;margin-bottom:6px}
  .scn-card.urllc .cat{background:var(--accent-bg);color:var(--accent)}
  .scn-card .bf{font-size:12.5px;line-height:20px;color:var(--muted);font-variant-numeric:tabular-nums}
  .claim{display:none;position:absolute;right:12px;top:12px;color:var(--primary);font-size:12.5px;font-weight:700}
  .scn-card.active .claim{display:block}

  /* 表格与滚动区 */
  .table-scroll,.calc-scroll{overflow-x:auto;max-width:100%}
  .scroll-hint{display:none;color:var(--muted);font-size:12.5px;margin:6px 0 0;text-align:right}
  .scroll-hint.show{display:block}
  table.req,table.map4g{width:100%;border-collapse:collapse;font-size:14px;line-height:23px}
  table.req th,table.req td,table.map4g th,table.map4g td{border:0;border-bottom:1px solid var(--border-soft);padding:10px 12px;text-align:left;vertical-align:top;min-height:42px}
  table.req th{background:var(--panel-2);width:140px;color:var(--muted);font-weight:600}
  table.req tr:first-child th{border-top:2px solid var(--primary)}
  table.map4g th{background:#EDF3F0;border-bottom:2px solid var(--primary);color:var(--text);font-weight:700}
  table.map4g th:first-child{color:var(--primary)}table.map4g th:nth-child(2){color:var(--info)}
  .tag{display:inline-block;font-size:12.5px;font-family:var(--mono);background:var(--panel-2);border:1px solid var(--border-soft);border-radius:4px;padding:2px 8px;color:var(--muted);margin:2px 4px 2px 0}

  /* 表单与按钮 */
  select,input[type=number]{width:100%;min-height:42px;background:var(--panel);border:1px solid var(--border);border-radius:6px;padding:8px 10px;font-size:14px;line-height:20px;font-weight:600;color:var(--text)}
  select:hover,input[type=number]:hover{border-color:var(--primary)}
  select:focus,input:focus{border-color:var(--primary);outline:3px solid rgba(0,109,114,.16);outline-offset:1px}
  select:disabled{background:#F0F3F1;color:var(--muted);opacity:1;cursor:not-allowed}
  .btn{min-height:40px;background:var(--primary);color:#fff;border:1px solid var(--primary);border-radius:6px;padding:8px 18px;font-size:14px;line-height:20px;font-weight:600;cursor:pointer;transition:background 160ms ease-out,border-color 160ms ease-out}
  .btn:hover{background:var(--primary-hover);border-color:var(--primary-hover)}
  .btn.ok{background:var(--primary)}
  .btn.ghost{background:var(--panel);color:var(--primary);border:1px solid var(--primary)}
  .btn.ghost:hover{background:var(--primary-bg)}
  .btn:disabled{background:#E5EAE8;border-color:#E5EAE8;color:#72817E;cursor:not-allowed}
  .navbtns{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:28px}
  .nav-next{display:flex;align-items:center;gap:12px}.nav-reason{font-size:12.5px;color:var(--warn)}

  /* 带宽计算器 */
  .calc-note{font-size:12.5px;color:var(--muted);margin:0 0 8px}
  .calc-row{display:grid;grid-template-columns:minmax(210px,1.6fr) .65fr .8fr .85fr .85fr 36px;gap:10px;align-items:center;min-height:52px;padding:6px 0;border-bottom:1px dashed var(--border-soft);font-size:14px}
  .calc-row.head{min-height:40px;font-size:12.5px;color:var(--muted);font-weight:600;border-bottom:1px solid var(--border)}
  .calc-row .num{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .calc-row .c-qty{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums}
  .c-del{width:32px;height:32px;background:none;border:1px solid transparent;border-radius:5px;color:var(--bad);cursor:pointer}
  .c-del:hover{background:var(--bad-bg);border-color:var(--bad)}
  .qty-cell{position:relative}.qty-error{display:block;color:var(--bad);font-size:12.5px;line-height:18px;text-align:left;margin-top:2px}
  .calc-row.has-error{align-items:start;padding:8px 0}
  .calc-sum-bar{display:flex;gap:28px;margin-top:16px;padding:16px 18px;background:#EDF4F1;border-top:1px solid var(--border);border-bottom:1px solid var(--border);border-radius:8px;font-size:14px;flex-wrap:wrap}
  .calc-sum-bar b{font-family:var(--mono);font-size:17px;font-variant-numeric:tabular-nums}
  .calc-sum-bar .redundant{color:var(--primary);font-size:22px;line-height:26px;border-bottom:2px solid var(--accent)}
  .tier-tag{background:var(--panel);border:1px solid var(--primary);border-radius:4px;padding:0 6px;color:var(--primary)!important}
  .suggest{margin-top:12px;font-size:14px;padding:10px 14px;border-radius:8px;background:var(--primary-bg);border:1px solid var(--primary-line);color:var(--text);display:none}
  .suggest.show{display:block}.suggest.warn{background:var(--warn-bg);border-color:#E6CE9C}
  .baseline-compare{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;margin-top:16px;padding:12px 14px;background:var(--paper);border:1px solid var(--border-soft);border-radius:8px}
  .baseline-compare b{font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--primary)}
  .baseline-note{font-size:12.5px;color:var(--muted);margin:6px 0 0}
  .undo-bar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-top:12px;padding:8px 12px;background:var(--info-bg);border-radius:6px;color:var(--text)}

  /* 思考前置 */
  fieldset.think{position:relative;min-inline-size:0;border:1px solid #EBC8AF;border-left:4px solid var(--accent);background:var(--accent-bg);border-radius:10px;padding:32px 16px 12px;margin:0 0 16px;font-size:14px}
  fieldset.think::before{content:"THINK · 先判据，后参数";position:absolute;left:16px;top:8px;font-family:var(--mono);font-size:12.5px;letter-spacing:.06em;color:var(--accent)}
  .think-meta{position:absolute;right:16px;top:8px;color:var(--accent);font-size:12.5px}
  .think .tq{font-weight:700;margin:0 0 8px;padding:0;color:var(--text)}
  .think label{display:inline-flex;align-items:center;gap:8px;min-height:36px;margin:0 16px 0 0;padding:4px 8px;border-radius:5px;cursor:pointer;color:var(--text)}
  .think label:hover{background:rgba(185,81,24,.07)}
  .think input[type=radio]{width:18px;height:18px;margin:0;accent-color:var(--accent);flex:0 0 auto}
  .think .verdict{margin-top:8px;padding-top:8px;border-top:1px dashed #DDB896;font-size:14px;color:var(--accent);display:none}
  .think-next{margin-top:10px;color:var(--accent);font-size:12.5px;font-weight:600}

  /* 参数卡五态 */
  .pgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px}
  .pcard{border:1px solid var(--border);border-left:3px solid var(--border);border-radius:10px;padding:16px;background:var(--panel)}
  .pcard>label{display:block;font-size:14px;font-weight:700;color:var(--muted);margin-bottom:8px}
  .pcard .status{display:block;margin-top:12px;padding:10px 10px 0;border-top:1px dashed var(--border);font-size:14px;line-height:1.65;background:transparent}
  .status-title{font-weight:700;color:var(--muted);margin-bottom:3px}.status-body{color:var(--text)}
  .pcard.st-pending{border-left-color:var(--info)}.pcard.st-pending .status-title{color:var(--info)}
  .pcard.st-ok{border-left-color:var(--ok)}.pcard.st-ok .status{background:var(--ok-bg);padding:10px}.pcard.st-ok .status-title{color:var(--ok)}
  .pcard.st-bad{border-left-color:var(--bad)}.pcard.st-bad .status{background:var(--bad-bg);padding:10px}.pcard.st-bad .status-title{color:var(--bad)}
  .pcard.st-warn{border-left-color:var(--warn)}.pcard.st-warn .status{background:var(--warn-bg);padding:10px}.pcard.st-warn .status-title{color:var(--warn)}
  .retry{display:inline-flex;align-items:center;min-height:32px;margin-top:6px;font-size:12.5px;color:var(--primary);background:none;border:none;cursor:pointer;text-decoration:underline;padding:0}
  .badge4g{display:block;font-size:12.5px;line-height:20px;background:var(--info-bg);color:var(--info);border-radius:4px;padding:5px 8px;margin:0 0 10px;font-weight:400;white-space:normal}

  /* 拓扑工程图 · 横轴为物理距离 */
  .topo-wrap{overflow-x:auto;background-color:var(--paper);background-image:repeating-linear-gradient(0deg,var(--bg-rule-fine) 0 1px,transparent 1px 32px),repeating-linear-gradient(90deg,var(--bg-rule-fine) 0 1px,transparent 1px 32px);border:1px solid var(--border-soft);border-radius:8px}
  .topo-wrap svg{width:100%;min-width:900px;height:auto;display:block}
  .topo-head{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;margin:0 0 12px}
  .topo-head h3{margin:0}
  .topo-zoom{flex:none;min-height:30px;padding:4px 12px;font-size:12px;line-height:18px}
  .topo-wrap:fullscreen{padding:20px;display:flex;align-items:center;border-radius:0}
  .topo-wrap:fullscreen svg{min-width:0;max-height:calc(100vh - 40px)}
  .topo-wrap.zoom-fallback{position:fixed;inset:12px;z-index:1200;overflow:auto;box-shadow:0 10px 44px rgba(0,40,42,.28)}
  .topo-wrap.zoom-fallback svg{min-width:0}
  .plane-label{font-size:11px;fill:var(--muted);font-family:var(--mono);letter-spacing:.08em}
  .dev-box{fill:#fff;stroke:#A9BCB9;stroke-width:1.3}
  .dev-box.ghost{fill:#FBFCFB;stroke:#C6D4D1;stroke-dasharray:5 4}
  .dev-title{font-size:14.5px;font-weight:700;fill:var(--text)}
  .dev-sub{font-size:11px;fill:var(--muted)}
  .dev-hint{font-size:11px;fill:var(--primary);font-family:var(--mono)}
  .link-up{fill:none;stroke:var(--primary);stroke-width:2.2;stroke-linecap:round}
  .link-up.overload{stroke:var(--bad);stroke-dasharray:3 5}
  .link-cp{fill:none;stroke:var(--info);stroke-width:1.5;stroke-dasharray:5 5;opacity:.8}
  .fence{fill:none;stroke:var(--primary);stroke-width:1.8;stroke-dasharray:9 6;transition:width 340ms cubic-bezier(.35,0,.2,1),stroke 200ms ease-out,stroke-dasharray 200ms}
  .fence.solid{stroke-dasharray:none;fill:url(#hatch)}
  .fence.weak{stroke:#A9BCB9;stroke-width:1.4;stroke-dasharray:3 5}
  .tn-card{fill:#fff;stroke:var(--border);stroke-width:1;transition:fill 200ms ease-out,stroke 200ms ease-out}
  .tn-bar{transition:fill 200ms ease-out}
  .tn-name{font-size:11.5px;fill:var(--muted)}
  .tn-val{font-size:12px;fill:var(--text);font-family:var(--mono);font-variant-numeric:tabular-nums}
  .tn-state{font-size:11px;fill:var(--muted)}
  .st-ok .tn-card{fill:var(--ok-bg);stroke:var(--ok)}.st-ok .tn-bar{fill:var(--ok)}.st-ok .tn-state{fill:var(--ok)}
  .st-bad .tn-card{fill:var(--bad-bg);stroke:var(--bad)}.st-bad .tn-bar{fill:var(--bad)}.st-bad .tn-state{fill:var(--bad)}
  .st-warn .tn-card{fill:var(--warn-bg);stroke:var(--warn)}.st-warn .tn-bar{fill:var(--warn)}.st-warn .tn-state{fill:var(--warn)}
  .st-pending .tn-card{fill:var(--info-bg);stroke:var(--info)}.st-pending .tn-bar{fill:var(--info)}.st-pending .tn-state{fill:var(--info)}
  .tnode{cursor:pointer}
  .tnode:hover .tn-card,.tnode:focus-visible .tn-card{stroke-width:2}
  .tnode:focus-visible{outline:2px solid var(--focus);outline-offset:2px}
  .tnode.reveal{animation:nodeReveal 420ms ease-out both}
  @keyframes nodeReveal{from{opacity:.15}to{opacity:1}}
  #dmBand{transition:fill 200ms ease-out,stroke 200ms ease-out}
  #upfGroup,#dnGroup{transition:transform 340ms cubic-bezier(.35,0,.2,1)}
  .axis-line{stroke:var(--border);stroke-width:1;stroke-dasharray:2 4}
  .axis-text{font-size:11px;fill:var(--faint)}
  .topo-legend{display:flex;flex-wrap:wrap;align-items:center;gap:6px;margin:0 0 10px;font-size:12px;color:var(--muted)}
  .topo-legend i{display:inline-block;width:26px;height:0;border-top:2.2px solid var(--primary);margin-right:2px}
  .topo-legend i.lg-cp{border-top:1.6px dashed var(--info);margin-left:12px}
  .topo-legend i.lg-fence{width:16px;height:11px;border:1px solid var(--primary);border-radius:3px;background:repeating-linear-gradient(45deg,transparent 0 3px,rgba(0,109,114,.2) 3px 4px);margin-left:12px}
  .topo-legend i.lg-card{width:16px;height:11px;border:1px solid var(--border);border-left:3px solid var(--primary);border-radius:3px;margin-left:12px}
  @media(prefers-reduced-motion:reduce){
    .tnode.reveal{animation:none}
    #upfGroup,#dnGroup,.fence{transition:none}
  }

  /* 九槽成绩环与诊断日志 */
  .score-hero{position:relative;display:flex;align-items:center;gap:24px;flex-wrap:wrap;border-top:4px solid var(--primary);animation:scoreIn 480ms ease-out}
  @keyframes scoreIn{from{opacity:0;transform:scale(.96)}to{opacity:1;transform:scale(1)}}
  .ring{--score:0;--ring-color:var(--primary);width:112px;height:112px;border-radius:50%;display:flex;align-items:center;justify-content:center;flex:0 0 auto;background:repeating-conic-gradient(from -1deg,transparent 0deg 38deg,#fff 38deg 40deg),conic-gradient(var(--ring-color) calc(var(--score)*1%),var(--disabled) 0)}
  .ring-core{width:84px;height:84px;border-radius:50%;background:var(--panel);display:flex;flex-direction:column;align-items:center;justify-content:center;color:var(--ring-color);font-family:var(--mono);font-variant-numeric:tabular-nums;line-height:1}
  .score-num{font-size:40px;line-height:44px;font-weight:700}.score-total{font-size:12px;line-height:16px;color:var(--muted)}
  .conditional{font-family:inherit;font-size:16px;font-weight:700}.conditional+span{font-size:12px;margin-top:5px;color:var(--muted)}
  .attempt{font-family:var(--mono);font-size:12.5px;letter-spacing:.04em;color:var(--primary);border:1px solid var(--primary-line);border-radius:4px;padding:1px 6px;vertical-align:middle}
  .score-conclusion{font-size:16px;font-weight:700;color:var(--text);margin-top:6px}
  .stale-banner{padding:12px 16px;margin-bottom:16px;background:var(--warn-bg);border:1px solid #E6CE9C;border-left:4px solid var(--warn);border-radius:8px;color:var(--text)}
  .stale-banner b{display:block;color:var(--warn);margin-bottom:3px}
  .diag{position:relative;border:1px solid var(--border);border-left:3px solid var(--border);border-radius:10px;padding:34px 16px 12px;margin-bottom:10px;font-size:14px;line-height:23px;background:var(--panel)}
  .diag::before{position:absolute;left:16px;top:10px;font-family:var(--mono);font-size:12.5px;font-weight:700;letter-spacing:.05em}
  .diag.ok{border-left-color:var(--ok)}.diag.ok::before{content:"PASS";color:var(--ok)}
  .diag.bad{border-left-color:var(--bad);background:var(--bad-bg)}.diag.bad::before{content:"FAIL";color:var(--bad)}
  .diag.warn{border-left-color:var(--warn);background:var(--warn-bg)}.diag.warn::before{content:"CHECK";color:var(--warn)}
  .diag:not(.ok):not(.bad):not(.warn)::before{content:"CHECK";color:var(--info)}
  .diag .dt{font-size:14.5px;font-weight:700;margin-bottom:3px}.diag-body{color:var(--text)}
  .diag-actions{text-align:right;margin-top:8px}.diag-actions .btn{min-height:40px;padding:8px 14px;font-size:12.5px}
  .missing-list{display:grid;gap:8px;margin:12px 0}.missing-item{display:flex;align-items:center;justify-content:space-between;gap:12px;padding:8px 12px;border-bottom:1px solid var(--border-soft)}
  .gauge{position:relative;height:12px;border-radius:6px;background:#E5ECE9;overflow:hidden;margin:8px 0 16px}
  .gauge>div{height:100%;border-radius:6px}.gauge-threshold{position:absolute;top:0;bottom:0;width:2px;background:var(--text)}

  footer{margin-top:12px;padding:22px 24px 28px;border-top:1px solid var(--border);background:rgba(255,255,255,.72);text-align:center;color:var(--muted);font-size:12.5px;line-height:1.9}
  footer p{margin:0}
  footer .foot-note{max-width:760px;margin:0 auto}
  footer .foot-copy{margin-top:6px;font-size:12px;color:var(--faint);font-variant-numeric:tabular-nums}
  footer .foot-sep{color:var(--border);margin:0 8px}
  .teacher-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:12px}
  .teacher-cell{background:var(--panel-2);border:1px solid var(--border-soft);border-radius:8px;padding:12px}
  .teacher-cell .n{font-family:var(--mono);font-size:20px;font-weight:700}.teacher-cell .l{font-size:12.5px;color:var(--muted)}
  .modal-overlay{position:fixed;inset:0;background:rgba(21,54,59,.32);z-index:100;display:flex;align-items:center;justify-content:center;padding:24px}
  .modal-dialog{position:relative;background:var(--panel);border-top:4px solid var(--primary);border-radius:14px;box-shadow:var(--shadow-pop);max-width:920px;width:100%;max-height:84vh;overflow:auto;padding:24px 28px}
  .modal-close-row{text-align:right}.modal-actions{display:flex;justify-content:flex-end;gap:12px;margin-top:20px}
  .toast{position:fixed;right:24px;bottom:24px;z-index:120;max-width:420px;padding:12px 16px;background:var(--warn-bg);border:1px solid var(--warn);border-radius:8px;box-shadow:var(--shadow-pop);color:var(--text)}

  @media(max-width:1100px){.layout{grid-template-columns:248px minmax(0,1fr)}main{padding-left:24px;padding-right:24px}}
  @media(max-width:900px){
    header{padding-left:20px;padding-right:20px;flex-wrap:wrap}.layout{grid-template-columns:1fr}
    nav.steps{position:static;height:auto;display:flex;overflow-x:auto;gap:8px;border-right:none;border-bottom:1px solid var(--border);padding:12px 16px}
    .step-item{min-width:176px;margin:0;min-height:62px}.step-item:not(:first-child)::before{display:none}
    main{padding-top:24px}.think label{min-height:44px}
  }
  @media(max-width:640px){
    header{position:relative;padding:12px 16px 0;gap:8px}header .logo{font-size:18px;flex-basis:100%}.seal{width:28px;height:28px}header .spacer{display:none}

    .think label{display:flex;margin:0;min-height:44px}.think-meta{position:static;display:block;margin:-24px 0 8px;text-align:right}
    .baseline-compare{grid-template-columns:1fr}.navbtns{align-items:stretch}.nav-next{flex-direction:column;align-items:flex-end}.missing-item{align-items:flex-start;flex-direction:column}
    .modal-overlay{padding:12px}.modal-dialog{padding:20px 16px}.score-hero{gap:16px}
    footer{padding:18px 16px 22px;font-size:12px;line-height:1.8}footer .foot-copy{font-size:11.5px}
  }
  @media(prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important;scroll-behavior:auto!important}}
</style>

/* ============================================================
   §2 判定引擎（纯函数，继承旧版规则，一处出口）
   ============================================================ */
const ST = { UNSET:'unselected', PENDING:'pending', OK:'ok', BAD:'bad', WARN:'warn' };
const isNum = v => v !== '' && v !== null && v !== undefined;

function delayMetrics(sc, qi, loc){
  const pdb = QI_PDB[Number(qi)];
  const locDelay = loc === '园区下沉' ? 2 : 15;
  const simDelay = Math.round(0.15 * pdb + locDelay);
  return { qi:Number(qi), pdb, loc, locDelay, simDelay, threshold:sc.delayThreshold, pass: simDelay <= sc.delayThreshold };
}
function capacityMetrics(sc, spec){
  const capacity = CAPACITY[spec];
  const satisfaction = Math.round(capacity / sc.bandwidthReq * 100);
  const occupancy = Math.round(sc.bandwidthReq / capacity * 100);
  let status, text;
  if(satisfaction >= 100){ status = ST.OK;
    text = `容量满足度 ${satisfaction}%，规格「${spec}」（${capacity}Mbps）可承载场景带宽需求 ${sc.bandwidthReq}Mbps。`;
  } else if(satisfaction >= 75 && spec === '10G'){ status = ST.WARN;
    text = `已选最高规格「10G」（${capacity}Mbps），但场景理论需求达 ${sc.bandwidthReq}Mbps，满足度约 ${satisfaction}%。工程上可分区域部署第二套 UPF 分流——此项"有条件通过"，不扣分。`;
  } else { status = ST.BAD;
    text = `容量不足：场景需求 ${sc.bandwidthReq}Mbps，当前规格「${spec}」仅 ${capacity}Mbps（满足度 ${satisfaction}%），请提高规格档位。`;
  }
  return { spec, capacity, req:sc.bandwidthReq, satisfaction, occupancy, status, text };
}
function evSingleRule(sc, sel, k){
  const v = sel[k];
  const base = { key:k, value:v, correct:sc.correct[k] };
  if(v === '' || v == null) return { ...base, status:ST.UNSET, text:'尚未选择。' };
  const ok = sc.correct[k].includes(v);
  const reason = sc.reason[k] || '参考值与该场景终端并发/速率量级匹配。';
  return { ...base, status: ok?ST.OK:ST.BAD,
    text: ok ? `✅ 判定正确 — ${reason}` : `❌ 判定错误 — 正确应为「${sc.correct[k].join(' / ')}」。${reason}` };
}
function evFrame(sc, sel){
  const v = sel.frame;
  if(!v) return { key:'frame', value:v, correct:sc.correct.frame, status:ST.UNSET, text:'尚未选择。' };
  const ok = sc.correct.frame.includes(v);
  return { key:'frame', value:v, correct:sc.correct.frame, status: ok?ST.OK:ST.BAD,
    text: ok ? `✅ 判定正确 — ${sc.reason.frame}` : `❌ 判定错误 — 正确应为「${sc.correct.frame.join(' / ')}」。${sc.reason.frame}` };
}
function evSlot(sc, sel){
  const {frame, slot} = sel;
  if(!frame) return { key:'slot', value:slot, status: slot?ST.PENDING:ST.UNSET, text:'需先选择③帧结构类型。' };
  if(!slot) return { key:'slot', value:slot, status:ST.PENDING, text:'⏳ 待选择 — 请先确定③帧结构，再选时隙配比。' };
  const legal = (SLOT_BY_FRAME[frame]||[]).includes(slot);
  return { key:'slot', value:slot, status: legal?ST.OK:ST.BAD,
    text: legal ? `✅ 与帧结构「${frame}」联动匹配（合法组合：${SLOT_BY_FRAME[frame].join(' / ')}）。`
                : `❌ 时隙配比「${slot}」与帧结构「${frame}」不配套，合法取值为 ${SLOT_BY_FRAME[frame].join(' / ')}。` };
}
// URLLC：⑥+⑧ 联合时延仿真（升级版：错误时明确诊断责任归属）
function evJointDelay(sc, sel){
  const qi = sel.qi, loc = sel.upfLoc;
  if(!isNum(qi) || !loc){
    const mk = (key, v, half) => ({ key, value:v, status: isNum(v)&&v!==''?ST.PENDING:ST.UNSET,
      text: (isNum(v)&&v!=='') ? half : '尚未选择。' });
    return { qi: mk('qi', qi, '⏳ 待判定 · 需配合⑧UPF部署位置'),
             upfLoc: mk('upfLoc', loc, '⏳ 待判定 · 需配合⑥5QI值') };
  }
  const m = delayMetrics(sc, qi, loc);
  // 反事实诊断：固定对方，换最优值看能否通过 —— 告诉学生问题出在哪半边
  const qiFixPass  = delayMetrics(sc, 3, loc).pass;   // 若换成最优 5QI=3 能否过
  const locFixPass = delayMetrics(sc, qi, '园区下沉').pass; // 若换成下沉能否过
  let diag;
  if(m.pass) diag = `仿真时延 ${m.simDelay}ms ≤ 阈值 ${m.threshold}ms，满足要求。`;
  else if(!qiFixPass && locFixPass) diag = `问题主要在 ⑥5QI：即使 UPF 保持「${loc}」，只要 5QI 预算降到 50ms（5QI=3）即可达标；当前 5QI=${m.qi} 的标准预算 ${m.pdb}ms 过高。`;
  else if(qiFixPass && !locFixPass) diag = `问题主要在 ⑧部署位置：当前 5QI=${m.qi} 的预算本身可行，但「集中部署」引入 15ms 回传时延导致超标，改为「园区下沉」（约 2ms）即可达标。`;
  else diag = `⑥与⑧都有问题：5QI=${m.qi} 预算 ${m.pdb}ms 过高，且「${loc}」回传时延也偏大，需同时改为 5QI=3 + 园区下沉。`;
  return {
    qi: { key:'qi', value:qi, status: m.pass?ST.OK:ST.BAD, metric:m,
      text: (m.pass?'✅ ':'❌ ') + diag + `（5QI=${m.qi} 标准时延预算 ${m.pdb}ms）` },
    upfLoc: { key:'upfLoc', value:loc, status: m.pass?ST.OK:ST.BAD, metric:m,
      text: (m.pass?'✅ ':'❌ ') + `部署位置对总时延贡献 ${m.locDelay}ms。` + diag }
  };
}
function evQiRule(sc, sel){
  const v = sel.qi;
  if(!isNum(v)) return { key:'qi', value:v, correct:sc.correct.qi, status:ST.UNSET, text:'尚未选择。' };
  const ok = sc.correct.qi.includes(Number(v));
  return { key:'qi', value:v, correct:sc.correct.qi, status: ok?ST.OK:ST.BAD,
    text: ok ? '✅ 判定正确 — 下行缓冲/浏览类业务对时延不敏感，5QI=6 或 9 即可。'
             : `❌ 判定错误 — 正确应为 5QI=${sc.correct.qi.join('或')}。该场景对时延不敏感，选 URLLC 级低时延 5QI 会浪费调度资源。` };
}
function evUpfLocRule(sc, sel){
  const v = sel.upfLoc;
  if(!v) return { key:'upfLoc', value:v, correct:sc.correct.upfLoc, status:ST.UNSET, text:'尚未选择。' };
  const ok = sc.correct.upfLoc.includes(v);
  return { key:'upfLoc', value:v, correct:sc.correct.upfLoc, status: ok?ST.OK:ST.BAD,
    text: ok ? '✅ 判定正确 — 时延不敏感，可集中部署降低建设与运维成本。'
             : `❌ 判定错误 — 正确应为「${sc.correct.upfLoc.join('/')}」。该场景无需下沉边缘，集中部署性价比更高。` };
}
function evUpfSpec(sc, sel){
  const v = sel.upfSpec;
  if(!v) return { key:'upfSpec', value:v, status:ST.UNSET, text:'尚未选择。' };
  const m = capacityMetrics(sc, v);
  return { key:'upfSpec', value:v, status:m.status, text:(m.status===ST.OK?'✅ ':m.status===ST.WARN?'⚠️ ':'❌ ')+m.text, metric:m };
}
function evaluateAll(sc, sel){
  const params = {};
  params.deployMode = evSingleRule(sc, sel, 'deployMode');
  params.band = evSingleRule(sc, sel, 'band');
  params.frame = evFrame(sc, sel);
  params.slot = evSlot(sc, sel);
  params.sst = evSingleRule(sc, sel, 'sst');
  if(sc.category === 'urllc'){
    const j = evJointDelay(sc, sel);
    params.qi = j.qi; params.upfLoc = j.upfLoc;
  } else {
    params.qi = evQiRule(sc, sel);
    params.upfLoc = evUpfLocRule(sc, sel);
  }
  params.ambr = evSingleRule(sc, sel, 'ambr');
  params.upfSpec = evUpfSpec(sc, sel);
  const metrics = {
    delay: (sc.category==='urllc' && isNum(sel.qi) && sel.upfLoc) ? delayMetrics(sc, sel.qi, sel.upfLoc) : null,
    capacity: sel.upfSpec ? capacityMetrics(sc, sel.upfSpec) : null
  };
  const done = PARAM_KEYS.filter(k => params[k].status === ST.OK).length;
  const allChosen = PARAM_KEYS.every(k => isNum(sel[k]));
  return { params, metrics, done, allChosen, total:PARAM_KEYS.length };
}

const TKEY = 'sa5g_teacher_stats';
function loadStats(){ try{ return JSON.parse(localStorage.getItem(TKEY)) || {}; }catch(e){ return {}; } }
function saveStats(s){ localStorage.setItem(TKEY, JSON.stringify(s)); }
function recordStats(scId, result){
  const all = loadStats();
  const rec = all[scId] || { total:0, wrong:{} };
  rec.total++;
  PARAM_KEYS.forEach(k => {
    if(result.params[k].status !== ST.OK) rec.wrong[k] = (rec.wrong[k]||0)+1;
  });
  all[scId] = rec; saveStats(all);
}

  { name:'场景与需求', desc:'认领场景，划出 5 项指标' },
  { name:'带宽估算', desc:'业务累加 +20% 冗余' },
  { name:'网络架构', desc:'① 部署模式 + 拓扑认知' },
  { name:'空口配置', desc:'② 频段 ③ 帧结构 ④ 时隙' },
  { name:'核心网配置', desc:'⑤ 切片 ⑥ 5QI ⑦ AMBR ⑧ UPF位置' },
  { name:'容量与规格', desc:'⑨ UPF 规格定档' },
  { name:'提交评测', desc:'诊断报告 + 导出成果' }
];

const main = document.getElementById('mainHost');
const navEl = document.getElementById('stepNav');

function renderNav(){
  navEl.innerHTML = STEPS.map((s, i) => {
    const locked = !app.scenario && i > 0;
    const cls = ['step-item', i===app.step?'active':'', locked?'locked':'', stepDone(i)?'done':''].join(' ');
    return `<button type="button" class="${cls}" data-step="${i}" ${i===app.step?'aria-current="step"':''} ${locked?'aria-disabled="true"':''}>
      <span class="step-num">${stepDone(i) && i!==app.step ? '✓' : String(i+1).padStart(2,'0')}</span>
      <span><span class="step-name">${s.name}</span><span class="step-desc">${s.desc}</span></span>
    </button>`;
  }).join('');
  navEl.querySelectorAll('.step-item').forEach(el => {
    el.addEventListener('click', () => {
      const i = Number(el.dataset.step);
      if(!app.scenario && i > 0) return;
      app.step = i; render();
    });
  });
}
function stepDone(i){
  if(i === 0) return !!app.scenario;
  if(i === 1) return app.calcRows.some(r => r.bizId && Number(r.qty) > 0);
  const groups = {2:['deployMode'], 3:['band','frame','slot'], 4:['sst','qi','ambr','upfLoc'], 5:['upfSpec']};
  if(groups[i]) return groups[i].every(k => isNum(app.sel[k]));
  return false;
}

function render(keepScroll){
  renderNav();
  const pages = [pageScenario, pageCalc, pageArch, pageRadio, pageCore, pageSpec, pageResult];
  const y = window.scrollY;
  main.innerHTML = '';
  const div = document.createElement('div');
  div.className = 'step-page show';
  div.innerHTML = pages[app.step]();
  main.appendChild(div);
  bindPage(app.step, div);
  if(keepScroll) window.scrollTo(0, y);
  else window.scrollTo({top:0, behavior:'smooth'});
  saveProgress();
}

/* 进度持久化：刷新不丢失（按场景隔离） */
const PKEY = 'sa5g_progress';
function saveProgress(){
  if(!app.scenario) return;
  try{
    localStorage.setItem(PKEY, JSON.stringify({
      scenarioId: app.scenario.id, sel: app.sel, think: app.think,
      calcRows: app.calcRows, calcSeq, attempts: app.attempts, step: app.step
    }));
  }catch(e){}
}
function loadProgress(){
  try{
    const p = JSON.parse(localStorage.getItem(PKEY));
    if(!p) return;
    const sc = SCENARIOS.find(s => s.id === p.scenarioId);
    if(!sc) return;
    app.scenario = sc; app.sel = p.sel || {}; app.think = p.think || {};
    app.calcRows = p.calcRows || []; calcSeq = p.calcSeq || 0;
    app.attempts = p.attempts || 0; app.step = p.step || 0;
  }catch(e){}
}
function navBtns(prevOk = true, nextLabel = '下一步 →', nextOk = true){
  const reason = app.step===0 && !nextOk ? '<span class="nav-reason" id="nextReason">请先选择一个行业场景</span>' : '';
  return `<div class="navbtns">
    <button class="btn ghost" id="prevBtn" ${app.step===0?'disabled':''}>← 上一步</button>
    <span class="nav-next">${reason}<button class="btn" id="nextBtn" ${nextOk?'':'disabled'} ${reason?'aria-describedby="nextReason"':''}>${nextLabel}</button></span>
  </div>`;
}

/* 每步任务行：做什么 + 完成度（填写≠合格，仅表示已填写） */
const STEP_TASK = [
  '选择 1 个场景，并看清覆盖、业务、带宽、时延、可靠性 5 项指标。',
  '添加业务并填写并发数，记住"×1.2 冗余后"的估算值。',
  '先判断数据隔离要求，再选择 ① 部署模式。',
  '依次完成 ② 频段 → ③ 帧结构 → ④ 时隙配比。',
  '完成 ⑤—⑧；URLLC 场景需联动检查 ⑥ 5QI 与 ⑧ UPF 位置。',
  '对照第 2 步估算和场景带宽基线，选择 ⑨ UPF 规格。',
  '补齐 9 项后提交；有错误时按诊断返回修改。'
];
const STEP_KEYS = [[], [], ['deployMode'], ['band','frame','slot'], ['sst','qi','ambr','upfLoc'], ['upfSpec'], []];
function stepGoal(i){
  let done = 0, total = 0;
  if(i === 0){
    total = 1; done = app.scenario ? 1 : 0;
  } else if(i === 1){
    total = 1;
    const rows = app.calcRows.filter(r => r.bizId);
    done = (rows.length && rows.every(r => Number(r.qty) >= 1)) ? 1 : 0;
  } else if(i === 6){
    total = PARAM_KEYS.length; done = PARAM_KEYS.filter(k => isNum(app.sel[k])).length;
  } else {
    const ks = STEP_KEYS[i] || [];
    total = ks.length; done = ks.filter(k => isNum(app.sel[k])).length;
  }
  return `<div class="step-goal">
    <span>${STEP_TASK[i]}</span>
    <span style="font-family:var(--mono);font-size:12.5px;color:${done===total?'var(--ok)':'var(--muted)'};white-space:nowrap">已填写 ${done} / ${total}</span>
  </div>`;
}

/* ---------- 步骤 1：场景与需求 ---------- */

/* ---------- 步骤 2：带宽估算 ---------- */
function pageCalc(){
  return `
    <h2 class="page-title">第 2 步 · 带宽估算</h2>
    <p class="page-sub">从业务资源池中挑出本场景会用到的业务，填并发数量，算出总带宽。这是中立算术工具，不计分——但算错会导致后面 ⑨UPF 规格选错。</p>
    ${stepGoal(1)}
    <div class="hint">📖 <b>计算方法：</b>逐业务：单路带宽 × 并发数量 = 小计；全部累加后 <b>×1.2（加 20% 冗余）</b>，再向上取整到标准档位（1G / 5G / 10G）。</div>
    <div class="card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
        <h3 style="margin:0">🧮 带宽估算计算器</h3>
        <button class="btn ghost" id="addRow">＋ 添加业务</button>
      </div>
      <div id="calcRows"></div>
      <div class="calc-sum-bar">
        <span>合计带宽：<b id="calcTotal">0 Mbps</b></span>
        <span>×1.2 冗余后：<b id="calcFinal" style="color:var(--blue)">0 Mbps</b></span>
        <span>建议 UPF 档位：<b id="calcTier" style="color:var(--ok)">—</b></span>
      </div>
      <div class="suggest" id="calcSuggest"></div>
    </div>
    ${navBtns(true, '下一步：网络架构 →')}
  `;
}
function tierOf(mbps){ return mbps <= 1000 ? '1G' : mbps <= 5000 ? '5G' : mbps <= 10000 ? '10G' : '超出10G（需分流）'; }

/* ---------- 步骤 3：网络架构（①部署模式 + 拓扑） ---------- */

    ${stepGoal(2)}
    ${thinkHtml('deployMode', '先想一想：本场景的数据安全和隔离要求，允许业务数据离开园区/矿区吗？', [
      ['绝不允许，需物理隔离','yes'],

    }[ans]))}
    <div class="pgrid">${paramCardHtml('deployMode')}</div>
    <div class="card" style="margin-top:18px">
      <div class="topo-head"><h3>🗺️ 5G SA 专网拓扑 · 你的选择落在哪里</h3><button type="button" class="btn ghost topo-zoom">⛶ 放大查看</button></div>
      <p style="font-size:12.5px;color:var(--muted);margin:0 0 8px">横轴是物理距离：节点间距越长，链路时延越大。选择⑧ UPF 部署位置时，UPF 会真的在图上移动——下沉就进园区围墙，回传链路随之缩短；集中就退到运营商侧，回传链路被拉长。点击任一参数牌可直接跳到它的配置位置。</p>
      <span class="topo-legend"><i></i>用户面链路<i class="lg-cp"></i>控制面信令<i class="lg-fence"></i>园区边界<i class="lg-card"></i>参数落位</span>

/* ---------- 步骤 6：容量与规格 ---------- */
function pageSpec(){
  const calcTotal = calcFinal();

    <h2 class="page-title">第 6 步 · ⑨ UPF 规格定档</h2>

    ${stepGoal(5)}

    <div class="pgrid">${paramCardHtml('upfSpec')}</div>
    ${navBtns(true, '下一步：提交评测 →')}

}

/* ---------- 步骤 7：提交评测 ---------- */
/* 第 7 步缺项清单：每项可直接回步 */
function missingListHtml(){
  const miss = PARAM_KEYS.filter(k => !isNum(app.sel[k]));
  if(!miss.length) return '';
  return `<div class="card">
    <h3>还差 ${miss.length} 项参数</h3>
    <div class="missing-list">
      ${miss.map(k => {
        const idx = PARAM_STEP_INDEX[k];
        return `<div class="missing-item">
          <span>${PARAM_LABELS[k]}<span style="color:var(--muted);font-size:12.5px">　· 第 ${idx+1} 步</span></span>
          <button class="btn ghost" data-goto-param="${k}">回到第 ${idx+1} 步</button>
        </div>`;
      }).join('')}
    </div>
  </div>`;
}

function pageResult(){
  const sc = app.scenario;
  let html = `
    <h2 class="page-title">第 7 步 · 提交仿真评测</h2>
    <p class="page-sub">提交后逐项判定并锁定答对项；答错项会给出错因诊断，可直接回到对应步骤修正后重新提交。</p>
    ${stepGoal(6)}
    <div class="card" style="text-align:center;padding:26px">
      <button class="btn ok" id="submitBtn" style="font-size:16px;padding:13px 44px" ${allFilled()?'':'disabled'}>
        ${app.snapshot ? '重新提交仿真' : '🚀 提交仿真评测'}
      </button>
      <div style="margin-top:10px;font-size:12.5px;color:var(--muted)">
        ${allFilled() ? '9 项参数已填写完整。提交后将生成成绩、方案拓扑、仿真仪表和逐项诊断。' : '还有参数未选择，暂不能提交。下列缺项可点击直接回到对应步骤：'}
      </div>
    </div>
    ${allFilled() ? '' : missingListHtml()}
    <div id="resultArea">${app.snapshot ? staleBannerHtml(app.snapshot) + resultHtml(app.snapshot, sc) : ''}</div>`;
  return html;
}
function allFilled(){ return PARAM_KEYS.every(k => isNum(app.sel[k])); }
function staleBannerHtml(snap){
  if(snap.live) return '';
  return `<div class="stale-banner"><b>结果已过期 · 当前显示第 ${snap.attempt} 次提交的历史快照</b>你在提交后修改了参数，以下成绩、拓扑和诊断不代表当前配置，请重新提交仿真。</div>`;
}

function resultHtml(snap, sc){
  const r = snap.result;
  const score = Math.round(r.done / r.total * 100);
  const nonOk = PARAM_KEYS.filter(k => r.params[k].status !== ST.OK);
  const onlyWarn = nonOk.length > 0 && nonOk.every(k => r.params[k].status === ST.WARN);
  const color = onlyWarn || score >= 60 ? (score >= 90 || onlyWarn ? 'var(--ok)' : 'var(--warn)') : 'var(--bad)';
  const m = r.metrics;
  return `
    <div class="card score-hero" id="resultSummary" tabindex="-1" aria-live="polite">
      <div class="ring" style="--score:${score};--ring-color:${color}"><div class="ring-core">${onlyWarn ? '<span class="conditional">有条件</span><span>通过</span>' : `<span class="score-num">${score}</span><span class="score-total">/100</span>`}</div></div>
      <div style="flex:1;min-width:240px">
        <h3 style="margin:0 0 4px">${sc.icon} ${sc.name} · 方案评估 <span class="attempt">ATTEMPT ${String(snap.attempt).padStart(2,'0')}</span></h3>
        <div class="score-conclusion">${score}/100 · ${r.done}/${r.total}项合格</div>
        <p style="margin:0;color:var(--muted);font-size:13.5px">${onlyWarn
          ? `9 项参数判定全部正确；其中 ${nonOk.length} 项受候选值上限限制为"有条件通过"，不计扣分。`
          : `9 项参数中 <b>${r.done}</b> 项判定正确。${nonOk.length ? '错误项诊断见下，可回对应步骤修正。' : '全部通过，🎉 方案达标！'}`}</p>
      </div>
      <button class="btn ghost" id="exportBtn">📄 ${snap.live ? '导出结果（Markdown）' : `导出第 ${snap.attempt} 次历史结果`}</button>
    </div>
    <div class="card">
      <div class="topo-head"><h3>🗺️ 方案拓扑总览</h3><button type="button" class="btn ghost topo-zoom">⛶ 放大查看</button></div>
      <p style="font-size:12.5px;color:var(--muted);margin:0 0 8px">本次提交的完整方案。参数牌按判定结果着色（绿=合格，红=不合格，黄=有条件通过）；⑨规格不足时用户面链路会标红，表示容量撑不住这条业务。点击任一参数牌可回到对应步骤修改。</p>
      <span class="topo-legend"><i></i>用户面链路<i class="lg-cp"></i>控制面信令<i class="lg-fence"></i>园区边界<i class="lg-card"></i>参数落位</span>
      <div class="topo-wrap" id="topoHost"></div>
    </div>
    ${(m.delay || m.capacity) ? `
    <div class="card"><h3>📊 仿真仪表</h3>

      ${m.capacity ? `<div style="font-size:13.5px;margin-top:8px">容量满足度：<b style="font-family:var(--mono);color:${m.capacity.status===ST.OK?'var(--ok)':m.capacity.status===ST.WARN?'var(--warn)':'var(--bad)'}">${m.capacity.satisfaction}%</b>（${m.capacity.capacity}Mbps / 需求 ${m.capacity.req}Mbps）</div>

    </div>` : ''}
    <div class="card"><h3>🩺 逐项诊断报告</h3>
      ${PARAM_KEYS.map(k => {
        const p = r.params[k];
        const cls = p.status===ST.OK?'ok':p.status===ST.WARN?'warn':p.status===ST.BAD?'bad':'';
        const stepNo = PARAM_STEP_INDEX[k] + 1;
        const action = p.status===ST.BAD

          : (p.status===ST.WARN ? `<button class="btn ghost" data-goto-param="${k}">查看第6步规格说明</button>` : '');
        return `<div class="diag ${cls}" id="diag-${k}"><div class="dt">${PARAM_LABELS[k]}：${p.value ?? '未选'}</div><div class="diag-body">${p.text}</div>${action ? `<div class="diag-actions">${action}</div>` : ''}</div>`;
      }).join('')}
    </div>
    <div class="card"><h3>📚 5G↔4G 参数对应关系</h3>
      <table class="map4g">
        <tr><th>5G SA 参数</th><th>4G LTE 对应</th><th>功能相似性</th><th>关键区别</th></tr>
        ${MAP4G_TABLE.map(r2 => `<tr>${r2.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}
      </table>
    </div>`;
}

/* 拓扑全屏查看：投影/细看时按屏幕宽度等比放大（SVG 矢量不糊），Esc 退出；
   全屏 API 不可用（如 iframe 内嵌）时降级为固定定位浮层 */
function updateZoomBtns(){
  const on = !!(document.fullscreenElement || document.querySelector('.topo-wrap.zoom-fallback'));
  document.querySelectorAll('.topo-zoom').forEach(b => { b.textContent = on ? '✕ 退出放大' : '⛶ 放大查看'; });
}
document.addEventListener('click', e => {
  const btn = e.target.closest && e.target.closest('.topo-zoom');
  if(!btn) return;
  const card = btn.closest('.card');
  const wrap = card && card.querySelector('.topo-wrap');
  if(!wrap) return;
  if(document.fullscreenElement){ document.exitFullscreen(); return; }
  if(wrap.classList.contains('zoom-fallback')){ wrap.classList.remove('zoom-fallback'); updateZoomBtns(); return; }
  if(wrap.requestFullscreen){
    const p = wrap.requestFullscreen();
    if(p && p.catch) p.catch(() => { wrap.classList.add('zoom-fallback'); updateZoomBtns(); });
  }else{
    wrap.classList.add('zoom-fallback'); updateZoomBtns();
  }
});
document.addEventListener('fullscreenchange', updateZoomBtns);
document.addEventListener('keydown', e => {
  if(e.key !== 'Escape') return;
  const z = document.querySelector('.topo-wrap.zoom-fallback');
  if(z){ z.classList.remove('zoom-fallback'); updateZoomBtns(); }
});

function paintTopo(){
  const host = document.getElementById('topoHost');
  if(!host || !app.scenario) return;
  if(!host.querySelector('svg')) host.innerHTML = topoSvg();
  const r = evaluateAll(app.scenario, app.sel);
  const snap = app.snapshot && app.snapshot.live ? app.snapshot.result : null;

  // 参数牌：值 + 判定色
  ['sst','qi','ambr','band','frame','slot','upfLoc','upfSpec'].forEach(k => {
    const g = host.querySelector('#tn-' + k);
    if(!g) return;
    const src = snap ? snap.params[k] : r.params[k];
    const v = app.sel[k];
    const has = isNum(v);
    const st = snap ? src.status : (has ? 'pending' : 'unselected');
    g.classList.remove('st-ok','st-bad','st-warn','st-pending');
    if(st !== 'unselected') g.classList.add('st-' + st);
    g.querySelector('.tn-val').textContent = has ? String(v) : '—';
    g.querySelector('.tn-state').textContent = !snap ? ''
      : src.status === ST.OK ? '✔' : src.status === ST.WARN ? '⚠'
      : src.status === ST.BAD ? '✘' : '';
  });

  // UPF 在图上移动：下沉进围墙，集中到运营商侧；DN 跟着一起走，园区内整段链路随之伸缩
  const dx = app.sel.upfLoc === '集中部署' ? TOPO_L.shift : 0;
  const upfL = TOPO_L.upfX + dx, upfR = upfL + TOPO_L.upfW;
  const dnL = TOPO_L.dnX + dx;
  const jump = app.topoDx === undefined || app.topoDx === dx;
  const prevDx = app.topoDx;
  const ug = host.querySelector('#upfGroup');
  const dg = host.querySelector('#dnGroup');
  // 页面每次重绘都会重建 SVG，所以要先把元素摆回上一次的位置，
  // 再过渡到新位置——否则动画的起点会丢，或者每次改参数都重放一次。
  const place = (el, val) => {
    if(!el) return;
    el.style.transition = 'none';
    el.style.transform = `translateX(${val}px)`;
    el.getBoundingClientRect();
    el.style.transition = '';
  };
  if(jump){
    place(ug, dx); place(dg, dx);
  } else {
    place(ug, prevDx); place(dg, prevDx);
    if(ug) ug.style.transform = `translateX(${dx}px)`;
    if(dg) dg.style.transform = `translateX(${dx}px)`;
  }
  app.topoDx = dx;
  // 位置未定时 UPF 画成虚框，表示"还没装进园区"
  const upfBox = ug && ug.querySelector('.dev-box');
  if(upfBox) upfBox.classList.toggle('ghost', !app.sel.upfLoc);
  // 下沉时数据网也在园区内，画实线；集中部署时在公网侧，画虚框
  const dnBox = dg && dg.querySelector('.dev-box');
  if(dnBox) dnBox.classList.toggle('ghost', app.sel.upfLoc !== '园区下沉');
  const l1 = host.querySelector('#linkGnUp');
  if(l1) l1.setAttribute('d', `M${TOPO_L.gnbR},260 H${upfL}`);
  const l2 = host.querySelector('#linkUpDn');
  if(l2) l2.setAttribute('d', `M${upfR},260 H${dnL}`);
  const n4 = host.querySelector('#n4Path');
  if(n4){
    const cx = upfL + TOPO_L.upfW / 2;
    n4.setAttribute('d', cx === 485 ? 'M485,152 V212' : `M485,152 V190 H${cx} V212`);
  }

  // 时延结论写在 UPF 上，随⑥⑧联合仿真变化
  const hint = host.querySelector('#upfHint');
  if(hint){
    const loc = app.sel.upfLoc;
    let t = '尚未确定部署位置', col = 'var(--muted)';
    if(loc && isNum(app.sel.qi)){
      const m = delayMetrics(app.scenario, app.sel.qi, loc);
      t = `${loc === '园区下沉' ? '本地分流' : '经回传'} · 时延 ${m.simDelay}ms`;
      col = m.pass ? 'var(--primary)' : 'var(--bad)';
    } else if(loc){
      t = loc === '园区下沉' ? '本地分流 · 数据不出园' : '经回传 · 数据出园';
      col = loc === '园区下沉' ? 'var(--primary)' : 'var(--bad)';
    }
    hint.textContent = t;
    hint.style.fill = col;
  }

  // ⑨规格不够时，用户面链路直接标红
  if(l2) l2.classList.toggle('overload', (snap ? snap.params.upfSpec.status : ST.UNSET) === ST.BAD);

  // ①部署模式：横幅文案 + 判定色 + 围墙形态
  const dm = app.sel.deployMode;
  const dmSt = snap ? snap.params.deployMode.status : (dm ? 'pending' : 'unselected');
  const dt = host.querySelector('#dmText');
  if(dt){
    const mark = dmSt === ST.OK ? '✔ ' : dmSt === ST.BAD ? '✘ ' : dmSt === ST.WARN ? '⚠ ' : '';
    dt.textContent = mark + (dm ? DM_TEXT[dm] : '① 部署模式：尚未选择 —— 先决定数据要不要出园区');
    dt.style.fill = dmSt === ST.OK ? 'var(--ok)' : dmSt === ST.BAD ? 'var(--bad)'
      : dmSt === ST.WARN ? 'var(--warn)' : '#0B4A4E';
  }
  const band = host.querySelector('#dmBand');
  if(band){
    band.style.fill = dmSt === ST.OK ? 'var(--ok-bg)' : dmSt === ST.BAD ? 'var(--bad-bg)'
      : dmSt === ST.WARN ? 'var(--warn-bg)' : dm ? 'rgba(0,109,114,.07)' : '#F1F6F4';
    band.style.stroke = dmSt === ST.OK ? 'var(--ok)' : dmSt === ST.BAD ? 'var(--bad)'
      : dmSt === ST.WARN ? 'var(--warn)' : dm ? 'var(--primary-line)' : '#D3E0DD';
  }
  const fence = host.querySelector('#topoFence');
  if(fence){
    const fw = app.sel.upfLoc === '园区下沉' ? TOPO_L.fenceWide : TOPO_L.fenceNarrow;
    const prevFw = app.topoFenceW;
    const jumpF = prevFw === undefined || prevFw === fw;
    fence.style.transition = 'none';
    fence.setAttribute('width', jumpF ? fw : prevFw);
    fence.getBoundingClientRect();
    fence.style.transition = '';
    if(!jumpF) fence.setAttribute('width', fw);
    app.topoFenceW = fw;
    fence.setAttribute('class', 'fence' + (dm === '独立专网' ? ' solid' : dm === '共享专网' ? '' : ' weak'));
  }
  // 数据不出园时，右侧运营商网络侧确实是闲置的
  const oh = host.querySelector('#outHint');
  if(oh) oh.textContent = app.sel.upfLoc === '园区下沉' ? '运营商网络侧 · 本方案未使用' : '';

  bindTopoNodes(host);
}

/* 拓扑网元可点击：从图上直接跳到对应参数的配置位置 */
function bindTopoNodes(host){
  const svg = host.querySelector('svg');
  if(!svg || svg.dataset.bound) return;
  svg.dataset.bound = '1';
  svg.querySelectorAll('.tnode[data-key]').forEach(g => {
    const key = g.dataset.key;
    if(!key || PARAM_STEP_INDEX[key] === undefined) return;
    g.setAttribute('role', 'button');
    g.setAttribute('tabindex', '0');
    g.setAttribute('aria-label', `前往 ${PARAM_LABELS[key]} 的配置`);
    const tip = document.createElementNS('http://www.w3.org/2000/svg', 'title');
    tip.textContent = `点击前往 ${PARAM_LABELS[key]}`;
    g.appendChild(tip);
    g.addEventListener('click', () => gotoParam(key));
    g.addEventListener('keydown', e => {
      if(e.key === 'Enter' || e.key === ' '){ e.preventDefault(); gotoParam(key); }
    });
  });
}

/* 提交评测后，拓扑按 ①—⑨ 顺序逐项点亮 */
function revealTopo(){
  const nodes = [...document.querySelectorAll('#topoHost .tnode')]
    .sort((a,b) => Number(a.dataset.order || 99) - Number(b.dataset.order || 99));
  nodes.forEach((n, i) => {
    n.style.animationDelay = (i * 70) + 'ms';
    n.classList.add('reveal');
  });
}

function markStale(){ if(app.snapshot) app.snapshot.live = false; }
function selectScenario(sc){
  app.scenario = sc; app.sel = {}; app.think = {}; app.calcRows = [];
  app.snapshot = null; app.attempts = 0;

function confirmScenarioChange(sc){
  const box = modal(`
    <h3 style="margin-top:0">更换场景将清空当前练习进度</h3>
    <p>将清空已选参数、思考题、带宽计算器和当前结果，且无法撤销。建议先导出已有结果。</p>
    <div class="modal-actions">
      <button class="btn ghost" id="keepScenario">保留当前场景</button>
      <button class="btn" id="confirmScenario">确认更换并清空</button>
    </div>`, { initialFocus:'#keepScenario' });
  box.overlay.querySelector('#keepScenario').addEventListener('click', box.close);
  box.overlay.querySelector('#confirmScenario').addEventListener('click', () => {
    box.close();
    selectScenario(sc);
    render();
  });
}

function bindPage(step, root){
  // 通用：底部翻页
  const prev = root.querySelector('#prevBtn'), next = root.querySelector('#nextBtn');
  if(prev) prev.addEventListener('click', () => { if(app.step>0){ app.step--; render(); } });
  if(next) next.addEventListener('click', () => { if(app.step<STEPS.length-1){ app.step++; render(); } });

  if(step === 0){
    root.querySelectorAll('.scn-card').forEach(c => c.addEventListener('click', () => {
      const sc = SCENARIOS.find(s => s.id === c.dataset.id);
      if(app.scenario && app.scenario.id !== sc.id){ confirmScenarioChange(sc); return; }
      if(!app.scenario) selectScenario(sc);
      render();
    }));
  }
  if(step === 1) bindCalc(root);
  if([2,3,4,5].includes(step)) bindParams(root, step);
  if(step === 6) bindResult(root);
}

/* 思考前置绑定 */
function bindThinks(root){
  root.querySelectorAll('.think').forEach(el => {
    const key = el.dataset.think;
    // 恢复之前已答的思考题状态（参数变化触发页面重绘时不丢失）
    const saved = app.think[key];
    if(saved){
      const t = THINK_ANSWERS[key];
      const radio = el.querySelector(`input[value="${saved}"]`);
      if(radio) radio.checked = true;
      const v0 = el.querySelector('.verdict');
      v0.style.display = 'block'; v0.className = 'verdict';
      v0.textContent = '💡 ' + t.verdictFn(saved);
    }
    el.querySelectorAll('input[type=radio]').forEach(radio => {
      radio.addEventListener('change', () => {
        const t = THINK_ANSWERS[key];
        app.think[key] = radio.value;
        const v = el.querySelector('.verdict');
        v.style.display = 'block';
        v.className = 'verdict';
        v.textContent = '💡 ' + t.verdictFn(radio.value);
      });
    });
  });
}

/* 参数卡绑定 */
function bindParams(root, step){
  if(step === 2){ const h = root.querySelector('#topoHost'); if(h){ h.innerHTML = topoSvg(); paintTopo(); } }
  bindThinks(root);
  const keys = {2:['deployMode'], 3:['band','frame','slot'], 4:['sst','qi','ambr','upfLoc'], 5:['upfSpec']}[step] || [];
  keys.forEach(key => {
    const sel = root.querySelector('#sel-' + key);
    if(!sel) return;
    sel.addEventListener('change', () => {
      app.sel[key] = sel.value;
      if(key === 'frame'){
        const legal = SLOT_BY_FRAME[sel.value] || [];
        if(app.sel.slot && !legal.includes(app.sel.slot)) app.sel.slot = '';
      }
      markStale();
      render(true);
    });
  });
  paintSnapshotOnCards(root, keys);
}
function paintSnapshotOnCards(root, keys){
  const snap = app.snapshot;
  keys.forEach(key => {
    const card = root.querySelector('#pcard-' + key);
    const stEl = root.querySelector('#status-' + key);
    const sel = root.querySelector('#sel-' + key);
    if(!card || !stEl) return;
    if(snap && snap.live){
      const p = snap.result.params[key];
      card.classList.add('st-' + p.status);
      stEl.innerHTML = p.text;
      if(p.status === ST.OK){ sel.disabled = true; }
      else if(p.status === ST.BAD || p.status === ST.WARN){
        // 只有判定为不合格 / 有条件通过时才给"重新选择"入口；未选与待判定不出现
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'retry'; b.textContent = '重新选择此项 →';
        b.addEventListener('click', () => {
          sel.disabled = false;
          card.scrollIntoView({behavior:motionBehavior(), block:'center'});
          sel.focus({preventScroll:true});
        });
        stEl.appendChild(b);
      }
    }
  });
}

/* 带宽计算器 */
let calcSeq = 0;
function validQty(value){ return /^[1-9]\d*$/.test(String(value).trim()); }
function qtyValue(r){ return r.qtyDraft !== undefined ? r.qtyDraft : r.qty; }
function calcFinal(){
  const total = app.calcRows.reduce((a, r) => {
    const b = BUSINESS_POOL.find(x => x.id === r.bizId);
    return a + (b && validQty(qtyValue(r)) ? b.unitMbps * Number(qtyValue(r)) : 0);
  }, 0);
  return +(total * (1 + REDUNDANCY)).toFixed(2);
}
function bindCalc(root){
  const host = root.querySelector('#calcRows');
  function updateTotals(){
    const total = app.calcRows.reduce((a, r) => {
      const b = BUSINESS_POOL.find(x => x.id === r.bizId);
      return a + (b && validQty(qtyValue(r)) ? b.unitMbps * Number(qtyValue(r)) : 0);
    }, 0);
    const fin = +(total * (1 + REDUNDANCY)).toFixed(2);
    root.querySelector('#calcTotal').textContent = total.toFixed(1) + ' Mbps';
    root.querySelector('#calcFinal').textContent = fin + ' Mbps';
    root.querySelector('#calcTier').textContent = fin > 0 ? tierOf(fin) : '—';
    const sg = root.querySelector('#calcSuggest');
    if(fin > 0 && app.scenario){
      sg.classList.add('show');
      sg.innerHTML = `📌 记住这个数字：<b>${fin} Mbps</b>，第 6 步选 ⑨UPF 规格时要用。` +
        (fin > app.scenario.bandwidthReq * 1.5 ? ' ⚠️ 注意：你的估算明显高于场景基线，检查一下是否多算了业务或数量。' : '');
    } else sg.classList.remove('show');
  }
  function syncQty(rowEl, input){
    const r = app.calcRows.find(x => x.rowId === Number(rowEl.dataset.row));
    const raw = input.value;
    const ok = validQty(raw);
    if(ok){ r.qty = String(Number(raw)); delete r.qtyDraft; }
    else { r.qtyDraft = raw; delete r.qty; }
    const b = BUSINESS_POOL.find(x => x.id === r.bizId);
    rowEl.classList.toggle('has-error', !ok);
    input.setAttribute('aria-invalid', String(!ok));
    const err = rowEl.querySelector('.qty-error');
    if(err) err.textContent = ok ? '' : '数量需为≥1的整数；此行暂不计入合计';
    rowEl.querySelector('.c-sub').textContent = b && ok ? (b.unitMbps * Number(raw)).toFixed(1) : '—';
    updateTotals();
  }
  function paint(){
    if(!app.calcRows.length){
      host.innerHTML = `<div style="padding:24px 18px;text-align:center">
        <div style="color:var(--muted);font-size:14px;margin-bottom:12px">还没有业务行。从本场景的真实业务开始，添加后填写并发数量。</div>
        <button type="button" class="btn ghost" id="addFirstRow">＋ 添加第一条业务</button>
      </div>`;
    } else {
      host.innerHTML = `<div class="calc-row head"><div>业务类型</div><div>方向</div><div>单路带宽</div><div>数量</div><div>小计(Mbps)</div><div></div></div>` +
        app.calcRows.map(r => {
          const b = BUSINESS_POOL.find(x => x.id === r.bizId);
          const raw = qtyValue(r);
          const ok = validQty(raw);
          const used = new Set(app.calcRows.map(x => x.bizId).filter(Boolean));
          return `<div class="calc-row${ok?'':' has-error'}" data-row="${r.rowId}">
            <select class="c-biz" aria-label="业务类型">
              <option value="">请选择业务类型…</option>
              ${BUSINESS_POOL.map(x => `<option value="${x.id}" ${x.id===r.bizId?'selected':''} ${x.id!==r.bizId && used.has(x.id)?'disabled':''}>${x.name}</option>`).join('')}
            </select>
            <div>${b?b.direction:'—'}</div>
            <div class="num">${b?b.unitMbps+' Mbps':'—'}</div>
            <div class="qty-cell"><input type="number" class="c-qty" min="1" step="1" placeholder="数量" value="${raw}" aria-invalid="${!ok}" aria-describedby="qty-error-${r.rowId}">
              <span class="qty-error" id="qty-error-${r.rowId}">${ok?'':'数量需为≥1的整数；此行暂不计入合计'}</span></div>
            <div class="num c-sub">${b && ok ? (b.unitMbps*Number(raw)).toFixed(1) : '—'}</div>
            <button class="c-del" title="删除" aria-label="删除业务行">✕</button>
          </div>`;
        }).join('');
    }
    updateTotals();
  }
  root.querySelector('#addRow').addEventListener('click', () => {
    app.calcRows.push({ rowId:++calcSeq, bizId:'', qty:'' }); paint();
  });
  host.addEventListener('input', e => {
    if(!e.target.classList.contains('c-qty')) return;
    const rowEl = e.target.closest('.calc-row'); if(!rowEl) return;
    syncQty(rowEl, e.target);
  });
  host.addEventListener('change', e => {
    const rowEl = e.target.closest('.calc-row'); if(!rowEl) return;
    const r = app.calcRows.find(x => x.rowId === Number(rowEl.dataset.row));
    if(e.target.classList.contains('c-biz')){ r.bizId = e.target.value; paint(); }
    if(e.target.classList.contains('c-qty')) syncQty(rowEl, e.target);
  });
  host.addEventListener('click', e => {
    if(e.target.id === 'addFirstRow'){
      app.calcRows.push({ rowId:++calcSeq, bizId:'', qty:'' });
      paint();
      const first = host.querySelector('.calc-row[data-row] select.c-biz');
      if(first) first.focus();
      return;
    }
    if(!e.target.classList.contains('c-del')) return;
    const rowEl = e.target.closest('.calc-row');
    app.calcRows = app.calcRows.filter(x => x.rowId !== Number(rowEl.dataset.row));
    paint();
  });
  paint();
}

/* 提交与结果 */
function motionBehavior(){ return matchMedia('(prefers-reduced-motion:reduce)').matches ? 'auto' : 'smooth'; }
function gotoParam(key){
  const step = PARAM_STEP_INDEX[key];
  if(step === undefined) return;
  app.step = step;
  render();
  const card = document.getElementById('pcard-' + key);
  const sel = document.getElementById('sel-' + key);
  if(card) card.scrollIntoView({behavior:motionBehavior(), block:'center'});
  if(sel) sel.focus({preventScroll:true});
}
function focusResultSummary(){
  const summary = document.getElementById('resultSummary');
  if(!summary) return;
  summary.scrollIntoView({behavior:motionBehavior(), block:'start'});
  summary.focus({preventScroll:true});
}
function bindResult(root){
  const th = root.querySelector('#topoHost');
  if(th){ th.innerHTML = topoSvg(); paintTopo(); }
  root.addEventListener('click', e => {
    const btn = e.target.closest('[data-goto-param]');
    if(btn) gotoParam(btn.dataset.gotoParam);
  });
  root.querySelector('#submitBtn').addEventListener('click', () => {
    if(!allFilled()) return;
    app.attempts++;
    app.snapshot = { result: evaluateAll(app.scenario, app.sel), live:true, attempt:app.attempts, at:new Date() };
    recordStats(app.scenario.id, app.snapshot.result);
    render();
    revealTopo();
    focusResultSummary();
  });
  const ex = root.querySelector('#exportBtn');
  if(ex) ex.addEventListener('click', exportMarkdown);
}

/* 导出 Markdown */
function exportMarkdown(){
  const sc = app.scenario, snap = app.snapshot;
  if(!snap) return;
  const r = snap.result;
  const lines = [];
  lines.push(`# ${sc.name} 5G SA 专网仿真评测结果`, '');
  lines.push(`- 提交次数：第 ${snap.attempt} 次 · 时间：${snap.at.toLocaleString('zh-CN')}`);
  lines.push(`- 总分：${r.done}/${r.total} 项合格`, '');
  lines.push(`## 参数配置与判定`, '');
  lines.push(`| 参数 | 本组取值 | 判定 | 说明 |`, `|---|---|---|---|`);
  PARAM_KEYS.forEach(k => {
    const p = r.params[k];
    const st = p.status===ST.OK?'✅合格':p.status===ST.WARN?'⚠️有条件通过':p.status===ST.BAD?'❌不合格':'未判定';
    lines.push(`| ${PARAM_LABELS[k]} | ${p.value ?? '—'} | ${st} | ${p.text.replace(/\|/g,'/')} |`);
  });
  if(r.metrics.delay) lines.push('', `## 时延仿真`, `仿真时延 ${r.metrics.delay.simDelay}ms（阈值 <${r.metrics.delay.threshold}ms），${r.metrics.delay.pass?'满足':'不满足'}要求。`);
  if(r.metrics.capacity) lines.push('', `## 容量仿真`, `UPF 规格 ${r.metrics.capacity.spec}（${r.metrics.capacity.capacity}Mbps），场景需求 ${r.metrics.capacity.req}Mbps，满足度 ${r.metrics.capacity.satisfaction}%。`);
  lines.push('', `## 5G↔4G 对应关系`, '', `| 5G SA | 4G LTE | 相似性 | 区别 |`, `|---|---|---|---|`);
  MAP4G_TABLE.forEach(row => lines.push(`| ${row.join(' | ')} |`));
  const blob = new Blob([lines.join('\n')], { type:'text/markdown;charset=utf-8' });
  const a = document.createElement('a');
  a.href = URL.createObjectURL(blob);
  a.download = `${sc.name}_5GSA仿真评测结果${snap.live ? '' : '_已过期'}.md`;
  a.click(); URL.revokeObjectURL(a.href);
}

/* ============================================================
   §7 顶栏弹层：4G 速查 + 教师统计
   ============================================================ */
function modal(html, options = {}){
  const trigger = document.activeElement;
  const ov = document.createElement('div');
  ov.className = 'modal-overlay';
  ov.innerHTML = `<div class="modal-dialog" role="dialog" aria-modal="true" tabindex="-1">
    <div class="modal-close-row"><button class="hbtn" id="mClose">关闭 ✕</button></div>${html}</div>`;
  const close = () => {
    window.removeEventListener('keydown', onKey);
    ov.remove();
    if(trigger && document.contains(trigger)) trigger.focus({preventScroll:true});
  };
  const onKey = e => { if(e.key === 'Escape') close(); };
  ov.addEventListener('click', e => { if(e.target === ov || e.target.id === 'mClose') close(); });
  window.addEventListener('keydown', onKey);
  document.body.appendChild(ov);
  const initial = options.initialFocus ? ov.querySelector(options.initialFocus) : ov.querySelector('#mClose');
  if(initial) initial.focus();
  return { overlay:ov, close };
}
document.getElementById('btn4g').addEventListener('click', () => {
  modal(`<h3 style="margin-top:0">📚 5G ↔ 4G 参数对应关系速查表</h3>
    <table class="map4g"><tr><th>5G SA 参数</th><th>4G LTE 对应</th><th>功能相似性</th><th>关键区别</th></tr>
    ${MAP4G_TABLE.map(r => `<tr>${r.map(c => `<td>${c}</td>`).join('')}</tr>`).join('')}</table>
    <p style="font-size:12.5px;color:var(--muted)">理解 5G 与 4G 参数的对应关系，有助于把已学的 4G 知识迁移到 5G 专网设计中。</p>`);
});
document.getElementById('btnTeacher').addEventListener('click', () => {
  const all = loadStats();
  const cells = [];
  Object.entries(all).forEach(([scId, rec]) => {
    const sc = SCENARIOS.find(s => s.id === scId);
    PARAM_KEYS.forEach(k => {
      const w = rec.wrong[k] || 0;
      if(rec.total > 0) cells.push({ sc: sc ? sc.name : scId, k, rate: Math.round(w/rec.total*100), w, t: rec.total });
    });
  });
  modal(`<h3 style="margin-top:0">👩‍🏫 教师统计（本机累计，按参数错误率）</h3>
    ${cells.length ? `<div class="teacher-grid">${cells.map(c => `
      <div class="teacher-cell"><div class="n" style="color:${c.rate>50?'var(--bad)':c.rate>20?'var(--warn)':'var(--ok)'}">${c.rate}%</div>
      <div class="l">${c.sc} · ${PARAM_LABELS[c.k]}（错 ${c.w}/${c.t} 次）</div></div>`).join('')}</div>
      <button class="hbtn" id="clearStats" style="margin-top:14px">🗑 清空统计</button>`
    : '<p style="color:var(--muted)">还没有提交记录。学生提交评测后，这里按参数累计错误率。</p>'}`);
  const cs = document.getElementById('clearStats');
  if(cs) cs.addEventListener('click', () => { localStorage.removeItem(TKEY); document.querySelector('.hbtn#mClose')?.click(); });
});

/* 启动 */
loadProgress();
render();
